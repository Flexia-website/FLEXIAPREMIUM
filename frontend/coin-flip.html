<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Flip - FLEXIA</title>
<!-- CORRECTED: Updated logo paths -->
<link rel="icon" type="image/x-icon" href="logo/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="logo/flexia-logo.png">
<link rel="icon" type="image/png" sizes="16x16" href="logo/flexia-logo.png">
<link rel="apple-touch-icon" href="logo/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<!-- Fonts & CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
font-family: 'Arial', sans-serif;
background: linear-gradient(135deg, #0A0A1F, #151535);
color: #F0F0F0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
padding: 20px;
}
.game-container {
text-align: center;
max-width: 500px;
width: 100%;
}
.game-header {
margin-bottom: 30px;
display: flex;
align-items: center;
justify-content: space-between;
}
.back-btn {
background: linear-gradient(45deg, #8000FF, #00CCFF);
border: none;
border-radius: 8px;
color: #0A0A1F;
padding: 10px 20px;
font-weight: bold;
cursor: pointer;
transition: all 0.3s;
display: flex;
align-items: center;
gap: 8px;
font-size: 0.9rem;
}
.back-btn:hover {
transform: translateY(-2px);
box-shadow: 0 5px 15px rgba(128, 0, 255, 0.4);
}
.game-logo {
display: flex;
align-items: center;
gap: 15px;
margin-bottom: 20px;
justify-content: center;
}
.game-logo-icon {
width: 50px;
height: 50px;
display: flex;
align-items: center;
justify-content: center;
background: linear-gradient(45deg, #8000FF, #00CCFF);
border-radius: 12px;
color: white;
font-weight: bold;
font-size: 1.5rem;
box-shadow: 0 5px 15px rgba(128, 0, 255, 0.3);
}
.game-title {
font-size: 2.5rem;
color: #8000FF;
text-shadow: 0 0 10px rgba(128, 0, 255, 0.6);
margin-bottom: 10px;
}
.game-subtitle {
color: #00CCFF;
font-size: 1.2rem;
}
.betting-section {
background: rgba(30, 30, 69, 0.8);
border-radius: 10px;
padding: 20px;
margin-bottom: 20px;
border: 1px solid #8000FF;
}
.balance-info {
font-size: 1.2rem;
margin-bottom: 15px;
color: #00FFCC;
}
.input-group {
margin-bottom: 20px;
}
.bet-input {
width: 100%;
padding: 15px;
background: #151535;
border: 2px solid #8000FF;
border-radius: 10px;
color: #F0F0F0;
font-size: 1.2rem;
text-align: center;
outline: none;
}
.bet-input:focus {
border-color: #00CCFF;
box-shadow: 0 0 10px rgba(0, 204, 255, 0.5);
}
.choice-buttons {
display: flex;
gap: 15px;
margin-bottom: 20px;
}
.choice-btn {
flex: 1;
padding: 20px;
background: rgba(128, 0, 255, 0.2);
border: 2px solid #8000FF;
border-radius: 10px;
color: #F0F0F0;
font-size: 1.2rem;
font-weight: bold;
cursor: pointer;
transition: all 0.3s;
}
.choice-btn:hover {
background: #8000FF;
transform: translateY(-2px);
}
.choice-btn.active {
background: #8000FF;
box-shadow: 0 0 15px rgba(128, 0, 255, 0.7);
}
.coin-container {
margin: 30px 0;
perspective: 1000px;
display: flex;
flex-direction: column;
align-items: center;
}
.coin-3d {
width: 150px;
height: 150px;
position: relative;
transform-style: preserve-3d;
transition: transform 2s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
.coin-face {
position: absolute;
width: 100%;
height: 100%;
border-radius: 50%;
backface-visibility: hidden;
display: flex;
align-items: center;
justify-content: center;
font-size: 2.5rem;
font-weight: bold;
box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
border: 5px solid #FFD700;
}
.heads {
background: linear-gradient(45deg, #FFD700, #D4AF37);
color: #8B4513;
transform: rotateY(0deg);
}
.tails {
background: linear-gradient(45deg, #C0C0C0, #A9A9A9);
color: #2F4F4F;
transform: rotateY(180deg);
}
.coin-edge {
position: absolute;
width: 100%;
height: 20px;
background: linear-gradient(45deg, #B8860B, #DAA520, #B8860B);
border-radius: 50%;
top: 50%;
transform: translateY(-50%) rotateX(90deg);
box-shadow: 0 0 10px rgba(184, 134, 11, 0.5);
}
.coin-shadow {
width: 160px;
height: 30px;
background: rgba(0, 0, 0, 0.3);
border-radius: 50%;
margin-top: 20px;
filter: blur(5px);
transition: all 0.3s;
}
.flip-btn {
padding: 15px 30px;
background: linear-gradient(45deg, #8000FF, #00CCFF);
border: none;
border-radius: 10px;
color: #0A0A1F;
font-size: 1.2rem;
font-weight: bold;
cursor: pointer;
transition: transform 0.2s, box-shadow 0.2s;
margin-bottom: 20px;
}
.flip-btn:hover {
transform: translateY(-2px);
box-shadow: 0 5px 15px rgba(128, 0, 255, 0.4);
}
.flip-btn:disabled {
opacity: 0.5;
cursor: not-allowed;
transform: none;
}
.result-section {
background: rgba(0, 255, 204, 0.1);
border-radius: 10px;
padding: 20px;
margin-top: 20px;
border: 1px solid #00FFCC;
display: none;
}
.result-message {
font-size: 1.5rem;
margin-bottom: 10px;
color: #00FFCC;
}
.winnings {
font-size: 2rem;
font-weight: bold;
color: #00FF55;
}
.coin-result {
font-size: 1.2rem;
margin: 10px 0;
color: #00CCFF;
}
.bet-info {
background: rgba(0, 204, 255, 0.1);
border-radius: 10px;
padding: 15px;
margin-top: 20px;
border-left: 5px solid #00CCFF;
}
.bet-info h3 {
color: #00CCFF;
margin-bottom: 10px;
}
.bet-info p {
margin-bottom: 5px;
font-size: 0.9rem;
}
.winning-streak {
display: flex;
justify-content: center;
gap: 10px;
margin-top: 15px;
}
.streak-dot {
width: 12px;
height: 12px;
border-radius: 50%;
background: #A0A0B5;
transition: all 0.3s;
}
.streak-dot.win {
background: #00FF55;
box-shadow: 0 0 10px #00FF55;
}
.streak-dot.loss {
background: #FF0055;
box-shadow: 0 0 10px #FF0055;
}
@keyframes coinToss {
0% {
transform: rotateY(0deg) translateY(0);
}
25% {
transform: rotateY(180deg) translateY(-50px);
}
50% {
transform: rotateY(360deg) translateY(0);
}
75% {
transform: rotateY(540deg) translateY(-30px);
}
100% {
transform: rotateY(720deg) translateY(0);
}
}
@keyframes shadowPulse {
0%, 100% {
transform: scale(1);
opacity: 0.5;
}
50% {
transform: scale(1.2);
opacity: 0.3;
}
}
.coin-tossing {
animation: coinToss 2s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
}
.shadow-pulsing {
animation: shadowPulse 2s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
}
@media (max-width: 500px) {
.game-title {
font-size: 2rem;
}
.game-subtitle {
font-size: 1rem;
}
.choice-buttons {
flex-direction: column;
}
.coin-3d {
width: 120px;
height: 120px;
}
.coin-face {
font-size: 2rem;
}
}
</style>
</head>
<body>
<div class="game-container">
<div class="game-header">
<button class="back-btn" onclick="goBackToDashboard()">
<i class="fas fa-arrow-left"></i> Dashboard
</button>
<div class="game-logo">
<div class="game-logo-icon">
<i class="fas fa-coins"></i>
</div>
<div>
<h1 class="game-title">COIN FLIP</h1>
<p class="game-subtitle">Bet and double your money! (Max 50 plays/day)</p>
</div>
</div>
</div>
<div class="betting-section">
<div class="balance-info">
Your Balance: <span id="balance">₦0.00</span>
</div>
<div class="input-group">
<input type="number" class="bet-input" id="bet-amount" placeholder="Enter bet amount" min="100">
<p style="margin-top: 10px; color: #A0A0B5; font-size: 0.9rem;">Minimum bet: ₦100.00</p>
</div>
<div class="choice-buttons">
<button class="choice-btn" id="heads-btn" onclick="selectChoice('heads')">
<i class="fas fa-crown"></i> HEADS
</button>
<button class="choice-btn" id="tails-btn" onclick="selectChoice('tails')">
<i class="fas fa-feather"></i> TAILS
</button>
</div>
<div class="coin-container">
<div class="coin-3d" id="coin-3d">
<div class="coin-face heads">H</div>
<div class="coin-face tails">T</div>
<div class="coin-edge"></div>
</div>
<div class="coin-shadow" id="coin-shadow"></div>
</div>
<div class="winning-streak" id="winning-streak">
</div>
<button class="flip-btn" id="flip-btn" onclick="flipCoin()" disabled>FLIP COIN</button>
</div>
<div class="result-section" id="result-section">
<div class="result-message" id="result-message"></div>
<div class="coin-result" id="coin-result"></div>
<div class="winnings" id="winnings"></div>
</div>
<div class="bet-info">
<h3>HOW TO PLAY</h3>
<p>• Choose Heads or Tails</p>
<p>• Enter your bet amount (minimum ₦100)</p>
<p>• Flip the coin - 50/50 chance to win</p>
<p>• If you win, you double your money!</p>
<p>• Max 50 plays per day</p>
</div>
</div>
<script>
// Game state
let userChoice = null;
let betAmount = 0;
let isFlipping = false;
let winningStreak = [];
let userBalance = 0;
let playsToday = 0;

function goBackToDashboard() {
window.location.href = 'index.html';
}

async function loadUserProfile() {
try {
const res = await fetch('/api/user/profile');
const data = await res.json();
if (data.success) {
userBalance = data.user.balance;
document.getElementById('balance').textContent = `₦${userBalance.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
// Load streak from game stats if available
const stats = data.user.game_stats?.coin_flip;
if (stats) {
winningStreak = (stats.streak || []).slice(-10);
}
updateWinningStreak();
} else {
window.location.href = 'index.html';
}
} catch (error) {
console.log('Profile load error:', error);
window.location.href = 'index.html';
}
}

function selectChoice(choice) {
userChoice = choice;
document.getElementById('heads-btn').classList.remove('active');
document.getElementById('tails-btn').classList.remove('active');
document.getElementById(choice + '-btn').classList.add('active');
checkFlipButton();
}

function checkFlipButton() {
const betInput = document.getElementById('bet-amount');
betAmount = parseFloat(betInput.value);
const flipBtn = document.getElementById('flip-btn');
if (userChoice && betAmount >= 100 && betAmount <= userBalance && !isFlipping) {
flipBtn.disabled = false;
} else {
flipBtn.disabled = true;
}
}

async function flipCoin() {
if (isFlipping) return;
isFlipping = true;
document.getElementById('flip-btn').disabled = true;

const bet = betAmount;
userBalance -= bet;
document.getElementById('balance').textContent = `₦${userBalance.toLocaleString('en-US', {minimumFractionDigits: 2})}`;

const coin = document.getElementById('coin-3d');
const shadow = document.getElementById('coin-shadow');
const resultSection = document.getElementById('result-section');
resultSection.style.display = 'none';

const result = Math.random() > 0.5 ? 'heads' : 'tails';
const win = (userChoice === result);

// Animate coin
coin.classList.add('coin-tossing');
shadow.classList.add('shadow-pulsing');

setTimeout(() => {
coin.style.transform = `rotateY(${win ? 720 : 900}deg)`;
}, 100);

setTimeout(async () => {
coin.classList.remove('coin-tossing');
shadow.classList.remove('shadow-pulsing');

// Report to backend
const res = await fetch('/api/games/coinflip/report', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ bet, won: win }),
credentials: 'include'
});
const data = await res.json();
if (data.success) {
userBalance = data.new_balance;
document.getElementById('balance').textContent = `₦${userBalance.toLocaleString('en-US', {minimumFractionDigits: 2})}`;

if (win) {
document.getElementById('result-message').textContent = 'YOU WIN! 🎉';
document.getElementById('result-message').style.color = '#00FF55';
document.getElementById('coin-result').textContent = `The coin landed on ${result.toUpperCase()}!`;
document.getElementById('winnings').textContent = `+₦${(bet * 2).toLocaleString()}`;
document.getElementById('winnings').style.color = '#00FF55';
winningStreak.push('win');
} else {
document.getElementById('result-message').textContent = 'YOU LOSE! 💔';
document.getElementById('result-message').style.color = '#FF0055';
document.getElementById('coin-result').textContent = `The coin landed on ${result.toUpperCase()}!`;
document.getElementById('winnings').textContent = `-₦${bet.toLocaleString()}`;
document.getElementById('winnings').style.color = '#FF0055';
winningStreak.push('loss');
}

if (winningStreak.length > 10) {
winningStreak.shift();
}
updateWinningStreak();
resultSection.style.display = 'block';
} else {
// Handle daily limit or other error
alert('❌ ' + (data.message || 'You can only play 50 times per day.'));
window.location.reload();
}

isFlipping = false;
document.getElementById('flip-btn').disabled = false;
checkFlipButton();
}, 2000);
}

function updateWinningStreak() {
const streakContainer = document.getElementById('winning-streak');
streakContainer.innerHTML = '';
const streakText = document.createElement('div');
streakText.textContent = 'Current Streak:';
streakText.style.fontSize = '0.8rem';
streakText.style.color = '#A0A0B5';
streakText.style.marginBottom = '5px';
streakContainer.appendChild(streakText);

const dotsContainer = document.createElement('div');
dotsContainer.style.display = 'flex';
dotsContainer.style.gap = '8px';
dotsContainer.style.justifyContent = 'center';

winningStreak.forEach(result => {
const dot = document.createElement('div');
dot.className = `streak-dot ${result}`;
dotsContainer.appendChild(dot);
});

for (let i = winningStreak.length; i < 10; i++) {
const dot = document.createElement('div');
dot.className = 'streak-dot';
dotsContainer.appendChild(dot);
}

streakContainer.appendChild(dotsContainer);

if (winningStreak.length > 0) {
const lastResult = winningStreak[winningStreak.length - 1];
let currentStreak = 0;
for (let i = winningStreak.length - 1; i >= 0; i--) {
if (winningStreak[i] === lastResult) {
currentStreak++;
} else {
break;
}
}
const streakCount = document.createElement('div');
streakCount.textContent = `${currentStreak} ${lastResult}s in a row`;
streakCount.style.fontSize = '0.7rem';
streakCount.style.color = lastResult === 'win' ? '#00FF55' : '#FF0055';
streakCount.style.marginTop = '5px';
streakContainer.appendChild(streakCount);
}
}

document.getElementById('bet-amount').addEventListener('input', checkFlipButton);

// Initialize
document.addEventListener('DOMContentLoaded', loadUserProfile);
</script>
</body>
</html>
