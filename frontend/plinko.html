<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plinko 3D - FLEXIA</title>
    
    <link rel="icon" type="image/x-icon" href="logo/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="logo/flexia-logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="logo/flexia-logo.png">
    <link rel="apple-touch-icon" href="logo/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #000000;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior-y: none;
        }
        
        /* Header */
        .header {
            background: #0A0A1F;
            padding: 12px 16px;
            border-bottom: 2px solid #8000FF;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            min-height: 60px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .fullscreen-btn {
            background: transparent;
            border: none;
            color: #8000FF;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            transition: all 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .fullscreen-btn:hover {
            color: #00CCFF;
        }
        
        .header-center {
            flex: 1;
            text-align: center;
        }
        
        .header-center h1 {
            font-size: 1.6rem;
            color: #8000FF;
            text-shadow: 0 0 10px rgba(128, 0, 255, 0.6);
            margin: 0;
        }
        
        .game-subtitle {
            font-size: 0.75rem;
            color: #A0A0B5;
            margin-top: 2px;
        }
        
        .close-btn {
            background: transparent;
            border: none;
            color: #FF0055;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            padding: 5px 10px;
            transition: all 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .close-btn:hover {
            color: #FF5599;
            transform: scale(1.1);
        }
        
        /* Betting Controls */
        .betting-controls {
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-shrink: 0;
            background: rgba(30, 30, 69, 0.8);
            border-bottom: 2px solid #8000FF;
            min-height: 80px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .bet-input-container {
            position: relative;
            flex: 0 0 auto;
        }
        
        .currency-symbol {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #00FFCC;
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 1;
        }
        
        .bet-input {
            padding: 12px 12px 12px 30px;
            width: 120px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid #8000FF;
            background: #151535;
            color: #FFFFFF;
            border-radius: 8px;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }
        
        .bet-input:focus {
            border-color: #00CCFF;
            box-shadow: 0 0 10px rgba(0, 204, 255, 0.5);
        }
        
        .drop-btn {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #0A0A1F;
            background: linear-gradient(45deg, #8000FF, #00CCFF);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            min-width: 120px;
            justify-content: center;
        }
        
        .drop-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(128, 0, 255, 0.4);
        }
        
        .drop-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .drop-btn#drop-all-btn {
            background: linear-gradient(45deg, #FF0055, #FF8800);
        }
        
        /* Main Game Area */
        .main-game {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow: auto;
            min-height: 0;
        }
        
        .plinko-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 0;
        }
        
        .plinko-board {
            position: relative;
            width: 100%;
            height: 400px;
            border: 3px solid #8000FF;
            border-radius: 10px;
            background: linear-gradient(180deg, #0A0A1F 0%, #151535 100%);
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 15px 35px rgba(128, 0, 255, 0.4);
            min-height: 400px;
        }
        
        .peg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .peg {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 30% 30%, #FFFFFF, #FFCC00);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.9),
                        0 0 15px rgba(0, 204, 255, 0.7);
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        
        .ball-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .ball {
            position: absolute;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle at 30% 30%, #00FFFF, #0088FF);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.9),
                        inset 2px 2px 6px rgba(255, 255, 255, 0.4);
            animation: ballPulse 1.5s infinite alternate;
        }
        
        /* Multiplier Row */
        .multiplier-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            margin: 10px 0;
            padding: 0 5px;
            gap: 5px;
        }
        
        .multiplier-slot {
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            padding: 8px 10px;
            border-radius: 8px;
            flex: 1;
            text-shadow: 0 0 5px currentColor;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid currentColor;
            transition: all 0.3s;
            box-shadow: 0 0 10px currentColor;
            min-width: 0;
            overflow: hidden;
        }
        
        .multiplier-slot.x10 { color: #FF0055; border-color: #FF0055; }
        .multiplier-slot.x3 { color: #FFCC00; border-color: #FFCC00; }
        .multiplier-slot.x0_5 { color: #00FF88; border-color: #00FF88; }
        
        .multiplier-slot.active {
            transform: scale(1.05);
            box-shadow: 0 0 20px currentColor;
        }
        
        /* Win Display */
        .win-display {
            margin: 15px 0;
            padding: 15px 20px;
            background: linear-gradient(45deg, rgba(128, 0, 255, 0.3), rgba(0, 204, 255, 0.3));
            border-radius: 12px;
            border: 2px solid #8000FF;
            text-align: center;
            width: 100%;
            max-width: 500px;
            display: none;
            animation: winPulse 1s ease-in-out;
            backdrop-filter: blur(10px);
        }
        
        .win-label {
            font-size: 0.9rem;
            color: #A0A0B5;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .win-amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00FF55;
            text-shadow: 0 0 15px rgba(0, 255, 85, 0.7);
            margin: 8px 0;
        }
        
        .win-multiplier {
            font-size: 1rem;
            color: #00CCFF;
            margin-top: 5px;
            font-weight: bold;
        }
        
        /* Stats Panel */
        .stats-panel {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            padding: 15px;
            background: rgba(30, 30, 69, 0.8);
            border-radius: 10px;
            border: 2px solid #8000FF;
            width: 100%;
            max-width: 500px;
            justify-content: space-between;
            backdrop-filter: blur(5px);
            flex-wrap: wrap;
        }
        
        .stat-item {
            text-align: center;
            flex: 1;
            min-width: 100px;
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: #A0A0B5;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #00FFCC;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
        }
        
        .ball-counter {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00FFCC;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border: 1px solid #8000FF;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        
        /* Animations */
        @keyframes ballPulse {
            0% { 
                box-shadow: 0 0 15px rgba(0, 255, 255, 0.8), 
                            inset 2px 2px 6px rgba(255, 255, 255, 0.3);
                transform: translate(-50%, -50%) scale(1);
            }
            100% { 
                box-shadow: 0 0 25px rgba(0, 255, 255, 1), 
                            inset 2px 2px 6px rgba(255, 255, 255, 0.5);
                transform: translate(-50%, -50%) scale(1.05);
            }
        }
        
        @keyframes ballDrop {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        
        @keyframes winPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-center h1 { font-size: 1.4rem; }
            .betting-controls { gap: 10px; padding: 12px; min-height: 70px; }
            .bet-input { width: 100px; padding: 10px 10px 10px 25px; font-size: 1rem; }
            .drop-btn { padding: 10px 15px; font-size: 0.9rem; min-width: 100px; }
            .plinko-board { height: 350px; min-height: 350px; }
            .multiplier-slot { font-size: 0.9rem; padding: 6px 8px; }
            .win-display { padding: 12px 16px; }
            .win-amount { font-size: 1.5rem; }
            .stats-panel { gap: 10px; padding: 12px; }
            .stat-item { min-width: 80px; }
        }
        
        @media (max-width: 480px) {
            .header { padding: 10px 12px; min-height: 50px; }
            .header-center h1 { font-size: 1.2rem; }
            .betting-controls { flex-direction: row; flex-wrap: wrap; gap: 8px; padding: 10px; min-height: auto; }
            .bet-input-container { order: 1; width: 100%; }
            .bet-input { width: 100%; max-width: 120px; margin: 0 auto; }
            .drop-btn { order: 2; flex: 1; min-width: 0; padding: 10px; }
            .drop-btn#drop-all-btn { order: 3; flex: 1; }
            .plinko-board { height: 300px; min-height: 300px; margin-bottom: 10px; }
            .multiplier-row { gap: 3px; padding: 0; }
            .multiplier-slot { font-size: 0.8rem; padding: 5px; min-width: 0; }
            .win-display { margin: 10px 0; padding: 10px 12px; }
            .win-amount { font-size: 1.3rem; }
            .stats-panel { flex-direction: column; gap: 8px; padding: 10px; }
            .stat-item { min-width: 100%; display: flex; justify-content: space-between; align-items: center; }
            .stat-label { margin-bottom: 0; font-size: 0.75rem; }
            .stat-value { font-size: 1rem; }
            .peg { width: 10px; height: 10px; }
        }
        
        @media (max-height: 700px) {
            .plinko-board { height: 280px; min-height: 280px; }
            .main-game { padding: 10px; }
            .betting-controls { padding: 10px; min-height: 65px; }
        }
        
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        button, input, select {
            touch-action: manipulation;
        }
        
        .main-game::-webkit-scrollbar {
            display: none;
        }
        
        .main-game {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
                ⛶
            </button>
        </div>
        <div class="header-center">
            <h1>PLINKO 3D</h1>
            <p class="game-subtitle">Min 0.5x • Max 10x • Daily cap: ₦800 wins</p>
        </div>
        <div class="header-right">
            <button class="close-btn" onclick="goBackToDashboard()" title="Close">
                ✕
            </button>
        </div>
    </div>

    <div class="betting-controls">
        <div class="bet-input-container">
            <span class="currency-symbol">₦</span>
            <input type="number" class="bet-input" id="bet-amount" value="500" min="100" max="50000" step="100">
        </div>
        <button class="drop-btn" id="drop-btn" onclick="addBallToQueue()">
            <i class="fas fa-plus-circle"></i> ADD BALL
        </button>
        <button class="drop-btn" id="drop-all-btn" onclick="dropAllBalls()">
            <i class="fas fa-play"></i> DROP ALL
        </button>
    </div>

    <div class="main-game">
        <div class="plinko-container">
            <div class="plinko-board" id="plinko-board">
                <div class="ball-counter" id="ball-counter">Balls: 0</div>
                <div class="peg-container" id="peg-container"></div>
                <div class="ball-container" id="ball-container"></div>
            </div>
        </div>
        
        <div class="multiplier-row">
            <div class="multiplier-slot x10" id="slot-0">×10</div>
            <div class="multiplier-slot x3" id="slot-1">×3</div>
            <div class="multiplier-slot x0_5" id="slot-2">×0.5</div>
            <div class="multiplier-slot x3" id="slot-3">×3</div>
            <div class="multiplier-slot x10" id="slot-4">×10</div>
        </div>
        
        <div class="win-display" id="win-display">
            <div class="win-label">TOTAL WIN</div>
            <div class="win-amount" id="win-amount">₦0</div>
            <div class="win-multiplier" id="win-multiplier">×0.0</div>
        </div>
        
        <div class="stats-panel">
            <div class="stat-item">
                <div class="stat-label">BALANCE</div>
                <div class="stat-value" id="balance">₦0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">ACTIVE BALLS</div>
                <div class="stat-value" id="active-balls">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">TOTAL WINS</div>
                <div class="stat-value" id="total-wins">0</div>
            </div>
        </div>
    </div>

    <script>
        // ==================== CONFIG ====================
        const API_BASE = '/api';
        const MIN_BET = 100;
        const MAX_BET = 50000;
        const MULTIPLIERS = [10, 3, 0.5, 3, 10];
        
        // ==================== STATE ====================
        let balance = 0;
        let gameStats = null;
        let activeBalls = 0;
        let totalWins = 0;
        let balls = [];
        let pegs = [];
        let animations = [];
        let queuedBalls = 0;
        let isDroppingAll = false;
        let gameInitialized = false;
        let betAmount = 500;
        let totalWinAmount = 0;
        
        // ==================== API CALLS ====================
        async function fetchProfile() {
            try {
                const res = await fetch(`${API_BASE}/user/profile`, {
                    credentials: 'include'
                });
                const data = await res.json();
                if (!data.success) {
                    alert('Please log in.');
                    window.location.href = 'index.html';
                    return;
                }
                balance = data.user.balance;
                gameStats = data.user.game_stats?.plinko || {};
                updateStatsDisplay();
            } catch (error) {
                console.error('Error fetching profile:', error);
                alert('Failed to load profile. Please try again.');
            }
        }
        
        async function submitGameResult(bet, multiplier) {
            try {
                // DIRECT API CALL - NO DEPENDENCIES
                const res = await fetch('/api/games/plinko/report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ bet: bet, multiplier: multiplier })
                });
                
                if (!res.ok) {
                    const errorText = await res.text();
                    return { success: false, message: `HTTP ${res.status}: ${errorText}` };
                }
                
                const data = await res.json();
                return data;
            } catch (error) {
                console.error('Error submitting game result:', error);
                return { success: false, message: 'Network error' };
            }
        }
        
        // ==================== UTILITIES ====================
        function goBackToDashboard() {
            animations.forEach(id => cancelAnimationFrame(id));
            animations = [];
            window.location.href = 'index.html';
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error: ${err.message}`);
                });
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
        
        function updateStatsDisplay() {
            document.getElementById('balance').textContent = `₦${balance.toLocaleString()}`;
            document.getElementById('active-balls').textContent = activeBalls;
            document.getElementById('total-wins').textContent = totalWins;
            document.getElementById('ball-counter').textContent = `Balls: ${queuedBalls}`;
        }
        
        // ==================== PEGS SETUP ====================
        function createPegs() {
            const container = document.getElementById('peg-container');
            container.innerHTML = '';
            pegs = [];
            
            const board = document.getElementById('plinko-board');
            const boardWidth = board.clientWidth;
            const boardHeight = board.clientHeight;
            
            const rows = 13;
            const horizontalSpacing = 35;
            const verticalSpacing = horizontalSpacing * Math.sin(Math.PI / 3);
            const startY = 40;
            
            for (let row = 0; row < rows; row++) {
                let pegsInRow;
                if (row === 0) {
                    pegsInRow = 2;
                } else if (row === 1) {
                    pegsInRow = 3;
                } else {
                    pegsInRow = row + 2;
                }
                
                const rowY = startY + (row * verticalSpacing);
                const rowWidth = (pegsInRow - 1) * horizontalSpacing;
                const rowOffset = (boardWidth - rowWidth) / 2;
                
                for (let col = 0; col < pegsInRow; col++) {
                    const x = rowOffset + (col * horizontalSpacing);
                    const y = rowY;
                    
                    const peg = {
                        x: x,
                        y: y,
                        radius: 6,
                        element: document.createElement('div')
                    };
                    
                    peg.element.className = 'peg';
                    peg.element.style.left = `${peg.x}px`;
                    peg.element.style.top = `${peg.y}px`;
                    peg.element.style.width = `${peg.radius * 2}px`;
                    peg.element.style.height = `${peg.radius * 2}px`;
                    
                    container.appendChild(peg.element);
                    pegs.push(peg);
                }
            }
        }
        
        // ==================== BALL MANAGEMENT ====================
        function addBallToQueue() {
            const betInput = parseInt(document.getElementById('bet-amount').value);
            
            if (isNaN(betInput) || betInput < MIN_BET || betInput > MAX_BET) {
                alert(`Please enter a valid bet amount between ₦${MIN_BET} and ₦${MAX_BET}`);
                return;
            }
            
            const totalCost = (queuedBalls + 1) * betInput;
            if (totalCost > balance) {
                alert('Insufficient balance for this many balls!');
                return;
            }
            
            betAmount = betInput;
            queuedBalls++;
            updateStatsDisplay();
            
            const dropBtn = document.getElementById('drop-btn');
            dropBtn.style.animation = 'bounce 0.3s';
            setTimeout(() => {
                dropBtn.style.animation = '';
            }, 300);
        }
        
        async function dropAllBalls() {
            if (queuedBalls === 0) {
                alert('Add some balls first!');
                return;
            }
            
            if (isDroppingAll) return;
            
            isDroppingAll = true;
            const ballsToDrop = queuedBalls;
            const totalCost = ballsToDrop * betAmount;
            
            if (totalCost > balance) {
                alert('Insufficient balance!');
                isDroppingAll = false;
                return;
            }
            
            // Disable buttons
            document.getElementById('drop-btn').disabled = true;
            document.getElementById('drop-all-btn').disabled = true;
            document.getElementById('bet-amount').disabled = true;
            
            queuedBalls = 0;
            totalWinAmount = 0;
            updateStatsDisplay();
            
            // Drop balls with delay
            for (let i = 0; i < ballsToDrop; i++) {
                setTimeout(() => {
                    createBall(betAmount);
                }, i * 200);
            }
            
            // Re-enable after all balls land
            setTimeout(() => {
                isDroppingAll = false;
                document.getElementById('drop-btn').disabled = false;
                document.getElementById('drop-all-btn').disabled = false;
                document.getElementById('bet-amount').disabled = false;
            }, ballsToDrop * 3000);
        }
        
        function createBall(bet) {
            const board = document.getElementById('plinko-board');
            const container = document.getElementById('ball-container');
            
            const ballId = Date.now() + Math.random();
            const ball = {
                id: ballId,
                x: board.clientWidth / 2,
                y: 35,
                vx: (Math.random() - 0.5) * 0.3,
                vy: 0.4,
                radius: 8,
                element: document.createElement('div'),
                landed: false,
                bet: bet,
                winAmount: 0,
                multiplier: 0
            };
            
            ball.element.className = 'ball';
            ball.element.style.left = `${ball.x}px`;
            ball.element.style.top = `${ball.y}px`;
            ball.element.style.animation = 'ballDrop 0.3s ease-out';
            container.appendChild(ball.element);
            
            balls.push(ball);
            activeBalls++;
            updateStatsDisplay();
            
            animateBall(ballId);
        }
        
        // ==================== BALL PHYSICS ====================
        function animateBall(ballId) {
            const ballIndex = balls.findIndex(b => b.id === ballId);
            if (ballIndex === -1 || balls[ballIndex].landed) return;
            
            const ball = balls[ballIndex];
            const board = document.getElementById('plinko-board');
            const boardWidth = board.clientWidth;
            const boardHeight = board.clientHeight;
            
            // Physics
            ball.vy += 0.22;
            ball.vx *= 0.996;
            
            ball.x += ball.vx;
            ball.y += ball.vy;
            
            // Wall collisions
            if (ball.x - ball.radius < 5) {
                ball.x = ball.radius + 5;
                ball.vx = Math.abs(ball.vx) * 0.85;
            }
            if (ball.x + ball.radius > boardWidth - 5) {
                ball.x = boardWidth - ball.radius - 5;
                ball.vx = -Math.abs(ball.vx) * 0.85;
            }
            
            // Peg collisions
            for (const peg of pegs) {
                const dx = ball.x - peg.x;
                const dy = ball.y - peg.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const collisionDistance = ball.radius + peg.radius;
                
                if (distance < collisionDistance) {
                    const angle = Math.atan2(dy, dx);
                    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                    
                    // Realistic bounce
                    ball.vx = Math.cos(angle) * speed * 0.8;
                    ball.vy = Math.sin(angle) * speed * 0.8;
                    
                    // Random variation
                    ball.vx += (Math.random() - 0.5) * 0.08;
                    
                    // Fix overlap
                    const overlap = collisionDistance - distance;
                    ball.x += Math.cos(angle) * overlap * 1.05;
                    ball.y += Math.sin(angle) * overlap * 1.05;
                    
                    // Visual feedback
                    peg.element.style.transform = 'translate(-50%, -50%) scale(1.5)';
                    peg.element.style.boxShadow = '0 0 20px rgba(0, 255, 255, 1)';
                    setTimeout(() => {
                        peg.element.style.transform = 'translate(-50%, -50%) scale(1)';
                        peg.element.style.boxShadow = '0 0 8px rgba(255, 255, 255, 0.9), 0 0 15px rgba(0, 204, 255, 0.7)';
                    }, 100);
                }
            }
            
            // Update ball position
            ball.element.style.left = `${ball.x}px`;
            ball.element.style.top = `${ball.y}px`;
            
            // Check if ball reached bottom
            if (ball.y > boardHeight - 50) {
                finishBall(ballIndex);
            } else {
                const animationId = requestAnimationFrame(() => animateBall(ballId));
                animations.push(animationId);
            }
        }
        
        async function finishBall(ballIndex) {
            const ball = balls[ballIndex];
            if (ball.landed) return;

            ball.landed = true;
            activeBalls--;

            const boardWidth = document.getElementById('plinko-board').clientWidth;
            const slotWidth = boardWidth / MULTIPLIERS.length;

            let slotIndex = Math.floor(ball.x / slotWidth);
            slotIndex = Math.max(0, Math.min(MULTIPLIERS.length - 1, slotIndex));

            const multiplier = MULTIPLIERS[slotIndex];

            // Submit to backend
            const result = await submitGameResult(ball.bet, multiplier);

            if (result.success) {
                // Use backend's authoritative values
                const netChange = parseFloat(result.net_change || 0);
                const winAmount = parseFloat(result.win_amount || 0);
                ball.winAmount = winAmount;
                ball.multiplier = multiplier;
                totalWinAmount += netChange;

                // Update balance from backend
                if (result.new_balance !== undefined) {
                    balance = parseFloat(result.new_balance);
                }

                if (netChange > 0) {
                    totalWins++;
                }

                // Highlight slot
                const slotElement = document.getElementById(`slot-${slotIndex}`);
                if (slotElement) {
                    slotElement.classList.add('active');
                    setTimeout(() => slotElement.classList.remove('active'), 800);
                }

                // Show daily cap warning
                if (result.daily_won !== undefined && result.daily_cap !== undefined) {
                    const remaining = result.daily_cap - result.daily_won;
                    if (remaining <= 0) {
                        isDroppingAll = false;
                        document.getElementById('drop-btn').disabled = true;
                        document.getElementById('drop-all-btn').disabled = true;
                        setTimeout(() => alert('🚫 Daily plinko win cap reached (₦800). Come back tomorrow!'), 100);
                    }
                }
            } else {
                // Handle error (e.g., daily limit reached)
                if (result.message) {
                    setTimeout(() => alert('❌ ' + result.message), 100);
                    isDroppingAll = false;
                    document.getElementById('drop-btn').disabled = false;
                    document.getElementById('drop-all-btn').disabled = false;
                    document.getElementById('bet-amount').disabled = false;
                }
            }
            
            // Animate ball out
            ball.element.style.transition = 'all 0.5s ease-out';
            ball.element.style.opacity = '0';
            ball.element.style.transform = 'translate(-50%, -50%) scale(0)';
            
            setTimeout(() => {
                if (ball.element.parentNode) {
                    ball.element.remove();
                }
                balls.splice(ballIndex, 1);
                
                // Show total win when all balls land
                if (activeBalls === 0 && !isDroppingAll) {
                    showTotalWin();
                }
                
                updateStatsDisplay();
            }, 500);
        }
        
        function showTotalWin() {
            const winDisplay = document.getElementById('win-display');
            const winAmountElement = document.getElementById('win-amount');
            const winMultiplierElement = document.getElementById('win-multiplier');

            const displayAmount = totalWinAmount;
            winAmountElement.textContent = displayAmount >= 0
                ? `+₦${displayAmount.toLocaleString('en-US', {minimumFractionDigits: 2})}`
                : `-₦${Math.abs(displayAmount).toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            winMultiplierElement.textContent = 'Net Result (Balance Updated)';

            winAmountElement.style.color = displayAmount >= 0 ? '#00FF55' : '#FF5555';
            winDisplay.style.display = 'block';
            winDisplay.style.animation = 'winPulse 1s ease-in-out';

            // Update stats display with refreshed balance
            updateStatsDisplay();

            setTimeout(() => {
                winDisplay.style.display = 'none';
            }, 5000);

            totalWinAmount = 0;
        }
        
        // ==================== INITIALIZATION ====================
        async function initGame() {
            if (gameInitialized) return;
            
            await fetchProfile();
            
            // Wait for layout to settle
            setTimeout(() => createPegs(), 100);
            
            // Bet input validation
            const betInput = document.getElementById('bet-amount');
            betInput.addEventListener('input', function() {
                let value = parseInt(this.value);
                if (isNaN(value)) value = MIN_BET;
                if (value < MIN_BET) value = MIN_BET;
                if (value > MAX_BET) value = MAX_BET;
                this.value = value;
            });
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !isDroppingAll) {
                    addBallToQueue();
                } else if (e.key === 'Escape') {
                    goBackToDashboard();
                } else if (e.key === 'f' || e.key === 'F') {
                    toggleFullscreen();
                } else if (e.key === ' ') {
                    e.preventDefault();
                    dropAllBalls();
                }
            });
            
            // Click on board to add ball
            document.getElementById('plinko-board').addEventListener('click', (e) => {
                if (e.target === document.getElementById('plinko-board') && !isDroppingAll) {
                    addBallToQueue();
                }
            });
            
            // Prevent context menu
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            });
            
            gameInitialized = true;
        }
        
        // Handle resize
        let resizeTimeout;
        function handleResize() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                createPegs();
                balls.forEach(ball => {
                    ball.element.style.left = `${ball.x}px`;
                    ball.element.style.top = `${ball.y}px`;
                });
            }, 250);
        }
        
        window.addEventListener('resize', handleResize);
        
        // Warn before leaving with active balls
        window.addEventListener('beforeunload', function(e) {
            if (activeBalls > 0 || queuedBalls > 0) {
                e.preventDefault();
                e.returnValue = 'You have active balls. Are you sure you want to leave?';
            }
        });
        
        // Start game when page loads
        document.addEventListener('DOMContentLoaded', async () => {
            await initGame();
        });
    </script>

    <!-- Enhanced Game Limit Checker -->
    <script>
    // Check for limit on game page load
    document.addEventListener('DOMContentLoaded', function() {
        const gameType = window.location.pathname.includes('snake') ? 'snake' :
                         window.location.pathname.includes('coinflip') ? 'coinflip' :
                         window.location.pathname.includes('plinko') ? 'plinko' : 'unknown';
        
        if (gameType !== 'unknown') {
            checkGameLimitOnLoad(gameType);
        }
    });
    
    async function checkGameLimitOnLoad(gameType) {
        try {
            const response = await fetch(`/api/games/check-limit-with-logout/${gameType}`, {
                credentials: 'include',
                headers: { 'Cache-Control': 'no-cache' }
            });
            
            if (!response.ok) {
                // If unauthorized, redirect to login
                if (response.status === 401) {
                    window.location.href = '/';
                    return;
                }
            }
            
            const data = await response.json();
            
            if (data.force_logout || (data.success === false && data.action_required === 'logout')) {
                // Show logout overlay
                showGameLimitOverlay(gameType, data);
                return false;
            }
            
            return true;
            
        } catch (error) {
            console.error('Limit check on load error:', error);
            return true; // Allow play on error
        }
    }
    
    function showGameLimitOverlay(gameType, data) {
        const overlay = document.createElement('div');
        overlay.id = 'game-limit-overlay';
        overlay.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 20px;
            font-family: 'Arial', sans-serif;
        `;
        
        const played = data.played_today || 0;
        const max = data.max_plays || 5;
        const resetTime = data.reset_time || 'midnight (00:00 UTC)';
        
        overlay.innerHTML = `
            <div style="max-width: 500px; padding: 30px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                       border-radius: 20px; border: 3px solid #ff4757; box-shadow: 0 20px 40px rgba(255, 71, 87, 0.3);">
                <div style="font-size: 4rem; margin-bottom: 20px; color: #ff4757;">??</div>
                <h2 style="color: #ff6b6b; margin-bottom: 15px; font-size: 2rem;">Daily Limit Reached!</h2>
                
                <div style="background: rgba(255, 71, 87, 0.1); padding: 20px; border-radius: 10px; margin: 20px 0;
                           border: 1px solid rgba(255, 71, 87, 0.3);">
                    <p style="font-size: 1.2rem; line-height: 1.6; margin-bottom: 15px;">
                        You've played <strong>${played}/${max}</strong> times today.<br>
                        Daily limits reset at <strong>${resetTime}</strong>.
                    </p>
                    
                    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; 
                               margin: 15px 0; color: #ffcc00;">
                        <i class="fas fa-calendar-day"></i>
                        <span>Played Today: ${played}/${max}</span>
                    </div>
                    
                    <div style="display: flex; align-items: center; justify-content: center; gap: 10px;
                               margin: 15px 0; color: #00d4ff;">
                        <i class="fas fa-clock"></i>
                        <span>Reset Time: ${resetTime}</span>
                    </div>
                    
                    <div style="display: flex; align-items: center; justify-content: center; gap: 10px;
                               margin: 15px 0; color: #ff6b6b; font-weight: bold;">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span>Auto-logout in <span id="game-logout-countdown">10</span> seconds</span>
                    </div>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 25px;">
                    <button onclick="forceLogoutFromGame('${gameType}')" 
                            style="background: linear-gradient(135deg, #ff4757 0%, #ff6b6b 100%);
                                   color: white; border: none; padding: 15px; border-radius: 10px;
                                   font-weight: bold; cursor: pointer; font-size: 1rem;">
                        <i class="fas fa-sign-out-alt"></i> Logout Now
                    </button>
                    
                    <button onclick="returnToDashboard()" 
                            style="background: transparent; color: #00d4ff; border: 1px solid #00d4ff;
                                   padding: 12px; border-radius: 10px; cursor: pointer; font-size: 0.9rem;">
                        <i class="fas fa-arrow-left"></i> Return to Dashboard
                    </button>
                </div>
            </div>
        `;
        
        document.body.appendChild(overlay);
        document.body.style.overflow = 'hidden';
        
        // Start countdown
        let countdown = 10;
        const countdownInterval = setInterval(() => {
            countdown--;
            const countdownEl = document.getElementById('game-logout-countdown');
            if (countdownEl) countdownEl.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(countdownInterval);
                forceLogoutFromGame(gameType);
            }
        }, 1000);
        
        overlay.countdownInterval = countdownInterval;
    }
    
    async function forceLogoutFromGame(gameType) {
        try {
            // Call logout endpoint
            await fetch('/api/games/force-logout/' + gameType, {
                method: 'POST',
                credentials: 'include'
            });
            
            // Clear session
            document.cookie = 'session_token=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
            
            // Show logout message
            const overlay = document.getElementById('game-limit-overlay');
            if (overlay) {
                overlay.innerHTML = `
                    <div style="max-width: 400px; text-align: center;">
                        <div style="font-size: 5rem; color: #00d4ff; margin-bottom: 20px;">??</div>
                        <h3 style="color: #00d4ff; margin-bottom: 15px;">Logged Out Successfully</h3>
                        <p style="font-size: 1.1rem;">You have been logged out due to daily limit.<br>Redirecting to login page...</p>
                    </div>
                `;
            }
            
            // Redirect after delay
            setTimeout(() => {
                window.location.href = '/?reason=daily_limit_reached&game=' + gameType;
            }, 2000);
            
        } catch (error) {
            console.error('Logout error:', error);
            window.location.href = '/?reason=daily_limit_reached';
        }
    }
    
    function returnToDashboard() {
        const overlay = document.getElementById('game-limit-overlay');
        if (overlay && overlay.countdownInterval) {
            clearInterval(overlay.countdownInterval);
        }
        window.location.href = '/';
    }
    </script>
