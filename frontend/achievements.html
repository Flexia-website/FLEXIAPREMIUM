<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Achievements - FLEXIA</title>
<link rel="icon" type="image/x-icon" href="logo/favicon.ico">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at 30% 20%, #1b1135, #0a0518);color:#F0F0F0;font-family:'Rajdhani',sans-serif;min-height:100vh;padding:12px;}
.container{max-width:900px;margin:0 auto;}

/* HEADER - Compact */
.header{background:rgba(255,255,255,0.02);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:36px;height:36px;background:linear-gradient(45deg,#8000FF,#00CCFF);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;color:#fff;font-family:'Orbitron',sans-serif;box-shadow:0 2px 12px rgba(128,0,255,0.25);}
.logo-text{font-size:1.1rem;font-family:'Orbitron',sans-serif;background:linear-gradient(90deg,#00eeff,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;}
.header-right{display:flex;align-items:center;gap:12px;font-size:0.8rem;}
.header-right .user{color:#00FFCC;font-weight:600;}
.header-right .bal{color:#A0A0B5;}

/* NAV - Compact */
.nav{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;background:rgba(255,255,255,0.02);border-radius:10px;padding:4px;border:1px solid rgba(255,255,255,0.04);}
.nav a{padding:6px 14px;border-radius:8px;color:#A0A0B5;text-decoration:none;font-size:0.75rem;font-weight:600;transition:all 0.3s;display:flex;align-items:center;gap:6px;}
.nav a:hover{background:rgba(255,255,255,0.03);color:#F0F0F0;}
.nav a.active{background:rgba(168,85,247,0.15);color:#a855f7;}

/* MAIN CONTENT */
.main{background:rgba(255,255,255,0.02);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;}

/* STATS BAR - Compact */
.stats-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.stat-item{background:rgba(128,0,255,0.06);border:1px solid rgba(128,0,255,0.1);border-radius:8px;padding:6px 14px;display:flex;align-items:center;gap:8px;flex:1;min-width:80px;}
.stat-item .num{font-size:1.1rem;font-weight:700;color:#00FFCC;font-family:'Orbitron',monospace;}
.stat-item .lbl{font-size:0.55rem;color:#A0A0B5;text-transform:uppercase;letter-spacing:0.5px;}

/* CLAIM BUTTON - Compact */
.claim-bar{background:linear-gradient(135deg,rgba(128,0,255,0.06),rgba(0,204,255,0.06));border:1px solid rgba(0,255,85,0.15);border-radius:10px;padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.claim-bar .msg{font-size:0.8rem;color:#A0A0B5;}
.claim-bar .msg strong{color:#00FF55;}
.claim-btn{background:linear-gradient(135deg,#00ff55,#00ccff);border:none;border-radius:8px;color:#0a0618;padding:6px 18px;font-size:0.75rem;font-weight:700;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:6px;}
.claim-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,255,85,0.25);}
.claim-btn:disabled{opacity:0.5;cursor:not-allowed;}
.claim-btn .spinner{display:none;}

/* CATEGORY FILTER - Compact */
.categories{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;}
.cat-btn{padding:4px 12px;background:transparent;border:1px solid rgba(255,255,255,0.04);border-radius:14px;color:#A0A0B5;cursor:pointer;font-size:0.65rem;font-weight:600;transition:all 0.3s;}
.cat-btn:hover{background:rgba(255,255,255,0.02);color:#F0F0F0;}
.cat-btn.active{background:rgba(168,85,247,0.12);border-color:rgba(168,85,247,0.2);color:#a855f7;}

/* ACHIEVEMENT GRID - Compact */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;}
.card{background:rgba(255,255,255,0.015);border:1px solid rgba(255,255,255,0.04);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:flex-start;transition:all 0.3s;position:relative;}
.card:hover{transform:translateY(-2px);border-color:rgba(128,0,255,0.15);}
.card.unlocked{border-color:rgba(0,255,85,0.12);background:rgba(0,255,85,0.02);}
.card .icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0;background:rgba(128,0,255,0.08);color:#8000FF;}
.card.unlocked .icon{background:linear-gradient(135deg,#8000FF,#00CCFF);color:#fff;}
.card .info{flex:1;min-width:0;}
.card .info h4{font-size:0.8rem;font-weight:700;color:#F0F0F0;margin-bottom:1px;font-family:'Rajdhani',sans-serif;}
.card .info p{font-size:0.6rem;color:#A0A0B5;margin-bottom:4px;line-height:1.3;}
.card .info .progress{height:3px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden;margin-bottom:3px;}
.card .info .progress .fill{height:100%;background:linear-gradient(90deg,#8000FF,#00CCFF);border-radius:2px;transition:width 0.6s ease;}
.card.unlocked .progress .fill{background:linear-gradient(90deg,#00FF55,#00CCFF);}
.card .info .meta{display:flex;justify-content:space-between;font-size:0.55rem;color:#A0A0B5;}
.card .info .meta .pts{color:#00FFCC;}
.card .info .meta .cash{color:#00FF55;}
.card .badge-unlocked{position:absolute;top:6px;right:6px;background:#00FF55;color:#0a0618;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.5rem;font-weight:700;}
.card .badge-new{position:absolute;top:6px;right:30px;background:#ff0055;color:#fff;padding:1px 6px;border-radius:6px;font-size:0.45rem;font-weight:700;}

/* LOADING */
.loading{text-align:center;padding:30px;color:#A0A0B5;}
.loading .spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,0.05);border-left-color:#8000FF;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 8px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* MESSAGE */
.msg{display:none;padding:8px 12px;border-radius:8px;font-size:0.75rem;margin-bottom:10px;text-align:center;}
.msg.success{background:rgba(0,255,85,0.06);border:1px solid rgba(0,255,85,0.15);color:#00FF55;display:block;}
.msg.error{background:rgba(255,0,85,0.06);border:1px solid rgba(255,0,85,0.15);color:#FF5555;display:block;}
.msg.info{background:rgba(0,204,255,0.06);border:1px solid rgba(0,204,255,0.15);color:#00CCFF;display:block;}

/* FOOTER */
.footer{text-align:center;padding:12px;color:#A0A0B5;font-size:0.65rem;margin-top:12px;border-top:1px solid rgba(255,255,255,0.02);}
.footer a{color:#00CCFF;text-decoration:none;margin:0 6px;}
.footer a:hover{text-decoration:underline;}

/* RESPONSIVE */
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr;}}
@media(max-width:400px){.grid{grid-template-columns:1fr;}.stats-bar{flex-direction:column;}.claim-bar{flex-direction:column;text-align:center;}.header{flex-wrap:wrap;gap:6px;}}
</style>
</head>
<body>
<div class="container">

<!-- HEADER - Compact -->
<header class="header">
  <div class="logo">
    <div class="logo-icon">F</div>
    <span class="logo-text">ACHIEVEMENTS</span>
  </div>
  <div class="header-right">
    <span class="user"><i class="fas fa-user"></i> <span id="username">Guest</span></span>
    <span class="bal"><i class="fas fa-wallet"></i> ₦<span id="balance">0.00</span></span>
  </div>
</header>

<!-- NAV - Compact -->
<nav class="nav">
  <a href="index.html"><i class="fas fa-home"></i> Home</a>
  <a href="snake.html"><i class="fas fa-gamepad"></i> Snake</a>
  <a href="coinflip.html"><i class="fas fa-coins"></i> Coin</a>
  <a href="plinko.html"><i class="fas fa-bullseye"></i> Plinko</a>
  <a href="achievements.html" class="active"><i class="fas fa-trophy"></i> Awards</a>
</nav>

<!-- MAIN -->
<div class="main">

  <!-- Message -->
  <div id="msg" class="msg"></div>

  <!-- Stats Bar -->
  <div class="stats-bar">
    <div class="stat-item"><span class="num" id="total">0</span><span class="lbl">Total</span></div>
    <div class="stat-item"><span class="num" id="unlocked">0</span><span class="lbl">Unlocked</span></div>
    <div class="stat-item"><span class="num" id="points">0</span><span class="lbl">Points</span></div>
  </div>

  <!-- Claim Bar -->
  <div class="claim-bar">
    <span class="msg"><i class="fas fa-gift"></i> Claim your achievement rewards manually</span>
    <button class="claim-btn" id="claimBtn" onclick="claimRewards()">
      <i class="fas fa-coins"></i> CLAIM ALL
    </button>
  </div>

  <!-- Categories -->
  <div class="categories">
    <button class="cat-btn active" data-cat="all">All</button>
    <button class="cat-btn" data-cat="gaming">Gaming</button>
    <button class="cat-btn" data-cat="earnings">Earnings</button>
    <button class="cat-btn" data-cat="streaks">Streaks</button>
    <button class="cat-btn" data-cat="special">Special</button>
  </div>

  <!-- Grid -->
  <div class="grid" id="grid">
    <div class="loading" id="loading"><div class="spinner"></div>Loading...</div>
  </div>

</div>

<!-- FOOTER -->
<div class="footer">
  <span>FLEXIA © 2026</span>
  <a href="receipt.html">Receipt</a>
  <a href="index.html">Dashboard</a>
</div>

</div>

<script>
// ============================================================
// FLEXIA ACHIEVEMENTS - Compact Redesigned Version
// ============================================================

let user = null;
let balance = 0;
let achievements = [];
let newAchievements = [];
let isLoading = false;
let isClaiming = false;

function showMessage(text, type = 'info') {
  const el = document.getElementById('msg');
  el.className = `msg ${type}`;
  el.textContent = text;
  if (type !== 'error') {
    setTimeout(() => { el.className = 'msg'; }, 4000);
  }
}

async function loadProfile() {
  try {
    const res = await fetch('/api/user/profile', { credentials: 'include', headers: { 'Cache-Control': 'no-cache' } });
    if (!res.ok) { if (res.status === 401) { window.location.href = 'index.html'; return null; } throw new Error(`HTTP ${res.status}`); }
    const data = await res.json();
    if (data.success) {
      user = data.user;
      balance = parseFloat(data.user.balance) || 0;
      document.getElementById('username').textContent = data.user.username;
      document.getElementById('balance').textContent = balance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return user;
    }
    window.location.href = 'index.html';
    return null;
  } catch (e) { console.error('Profile load error:', e); showMessage('Failed to load profile', 'error'); return null; }
}

async function loadAchievements() {
  if (isLoading) return;
  isLoading = true;
  const loading = document.getElementById('loading');
  try {
    if (loading) loading.style.display = 'block';
    const res = await fetch('/api/achievements', { credentials: 'include', headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.success) {
      achievements = data.achievements;
      document.getElementById('total').textContent = data.stats.total;
      document.getElementById('unlocked').textContent = data.stats.unlocked;
      document.getElementById('points').textContent = data.stats.points;
      newAchievements = achievements.filter(a => a.unlocked && !a.processed);
      achievements.forEach(a => a.processed = true);
      if (newAchievements.length > 0) {
        showMessage(`🎉 ${newAchievements.length} new achievement${newAchievements.length > 1 ? 's' : ''} unlocked!`, 'success');
      }
      if (data.current_balance !== undefined) {
        const nb = parseFloat(data.current_balance);
        if (nb !== balance) { balance = nb; document.getElementById('balance').textContent = nb.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
      }
      renderAchievements(achievements);
      if (loading) loading.style.display = 'none';
    } else { showMessage('Failed to load achievements', 'error'); }
  } catch (e) { console.error('Load error:', e); showMessage('Network error loading achievements', 'error'); if (loading) { loading.style.display = 'none'; loading.innerHTML = '<div style="color:#ff5555;font-size:2rem;margin-bottom:8px;"><i class="fas fa-exclamation-triangle"></i></div><p style="color:#ff5555;font-size:0.8rem;">Failed to load</p><button onclick="loadAchievements()" style="background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;margin-top:6px;font-size:0.7rem;">Retry</button>'; } }
  } finally { isLoading = false; }
}

function renderAchievements(list) {
  const grid = document.getElementById('grid');
  if (!list || list.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px;color:#A0A0B5;"><i class="fas fa-trophy" style="font-size:2rem;color:#8000FF;margin-bottom:10px;display:block;"></i>No achievements yet. Play games to unlock!</div>`;
    return;
  }
  grid.innerHTML = '';
  list.forEach(a => {
    const isNew = newAchievements.some(n => n.id === a.id);
    const pct = Math.min(100, Math.round(a.progress_percentage || 0));
    const card = document.createElement('div');
    card.className = `card ${a.unlocked ? 'unlocked' : ''}`;
    card.dataset.category = a.category;
    card.innerHTML = `
      <div class="icon"><i class="${a.icon || 'fas fa-trophy'}"></i></div>
      <div class="info">
        <h4>${a.title}</h4>
        <p>${a.description}</p>
        <div class="progress"><div class="fill" style="width:${pct}%"></div></div>
        <div class="meta">
          <span>${a.current_value}/${a.target_value}</span>
          <span><span class="pts">+${a.points} pts</span> <span class="cash">+₦${(a.cash_reward || 0).toLocaleString()}</span></span>
        </div>
      </div>
      ${a.unlocked ? '<div class="badge-unlocked"><i class="fas fa-check"></i></div>' : ''}
      ${isNew ? '<div class="badge-new">NEW</div>' : ''}
    `;
    grid.appendChild(card);
  });
}

// Category filter
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const cat = btn.dataset.cat;
    document.querySelectorAll('.card').forEach(c => {
      c.style.display = (cat === 'all' || c.dataset.category === cat) ? 'flex' : 'none';
    });
  });
});

async function claimRewards() {
  if (isClaiming) { showMessage('Please wait...', 'info'); return; }
  isClaiming = true;
  const btn = document.getElementById('claimBtn');
  const orig = btn.innerHTML;
  try {
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    const res = await fetch('/api/achievements/claim', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.success) {
      balance = data.new_balance;
      document.getElementById('balance').textContent = balance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      showMessage(`✅ Rewards claimed! New balance: ₦${data.new_balance.toLocaleString()}`, 'success');
      btn.innerHTML = '<i class="fas fa-check"></i> DONE!';
      setTimeout(() => loadAchievements(), 800);
      setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; isClaiming = false; }, 2500);
    } else { throw new Error(data.message || 'Claim failed'); }
  } catch (e) { console.error('Claim error:', e); showMessage('❌ ' + e.message, 'error'); btn.innerHTML = orig; btn.disabled = false; isClaiming = false; }
}

async function init() {
  await loadProfile();
  await loadAchievements();
  // Auto-refresh every 60 seconds
  setInterval(() => { loadAchievements(); }, 60000);
}

document.addEventListener('DOMContentLoaded', init);

// Quick refresh on visibility change
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    loadAchievements();
  }
});
</script>
</body>
</html>
