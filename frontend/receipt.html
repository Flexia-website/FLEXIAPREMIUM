<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdrawal Receipt - FLEXIA</title>
<link rel="icon" type="image/x-icon" href="logo/favicon.ico">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at 30% 20%, #1b1135, #0a0518);color:#F0F0F0;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
.header{background:rgba(10,6,24,0.85);backdrop-filter:blur(18px);padding:16px 24px;border-bottom:2px solid rgba(128,0,255,0.3);display:flex;justify-content:space-between;align-items:center;}
.logo-container{display:flex;align-items:center;gap:14px;}
.logo-icon{width:40px;height:40px;border-radius:12px;overflow:hidden;background:linear-gradient(45deg,#8000FF,#00CCFF);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;color:#fff;box-shadow:0 4px 20px rgba(128,0,255,0.3);}
.app-title{font-size:1.3rem;font-weight:700;font-family:'Orbitron',sans-serif;background:linear-gradient(90deg,#00eeff,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;}
.back-btn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:#A0A0B5;padding:8px 16px;border-radius:8px;cursor:pointer;transition:all 0.3s;font-size:0.9rem;}
.back-btn:hover{background:rgba(255,255,255,0.05);color:#F0F0F0;}
.main-content{flex:1;padding:24px;display:flex;flex-direction:column;align-items:center;overflow:auto;max-width:1200px;margin:0 auto;width:100%;}
#history-toggle{background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.3);color:#a855f7;padding:10px 20px;border-radius:10px;cursor:pointer;margin-bottom:20px;font-weight:700;transition:all 0.3s;}
#history-toggle:hover{background:rgba(168,85,247,0.25);transform:translateY(-2px);}
#receipt-container{width:100%;max-width:600px;}
.receipt{background:rgba(255,255,255,0.02);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;box-shadow:0 10px 40px rgba(0,0,0,0.2);margin-bottom:20px;}
.receipt-header{text-align:center;margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid rgba(128,0,255,0.2);}
.receipt-title{font-size:1.6rem;font-weight:700;color:#a855f7;font-family:'Orbitron',sans-serif;margin-bottom:4px;}
.receipt-subtitle{color:#00CCFF;font-size:0.85rem;}
.receipt-details{margin-bottom:20px;}
.detail-row{display:flex;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.03);}
.detail-label{color:#A0A0B5;font-weight:500;}
.detail-value{color:#00EEFF;font-weight:600;text-align:right;}
.amount-value{font-size:1.5rem;font-weight:700;color:#00FF55;text-align:right;font-family:'Orbitron',sans-serif;}
.status-badge{padding:3px 12px;border-radius:12px;font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.status-pending{background:rgba(255,165,0,0.15);color:#FFA500;border:1px solid rgba(255,165,0,0.2);}
.status-completed{background:rgba(0,255,85,0.1);color:#00FF55;border:1px solid rgba(0,255,85,0.2);}
.status-failed{background:rgba(255,0,85,0.1);color:#FF0055;border:1px solid rgba(255,0,85,0.2);}
.receipt-footer{text-align:center;margin-top:20px;padding-top:16px;border-top:2px solid rgba(128,0,255,0.2);color:#A0A0B5;font-size:0.8rem;}
.action-buttons{display:flex;gap:12px;margin-top:20px;width:100%;max-width:600px;}
.action-btn{flex:1;padding:12px 20px;border:none;border-radius:10px;font-weight:700;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:8px;}
.download-btn{background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;}
.download-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(168,85,247,0.3);}
.dashboard-btn{background:linear-gradient(135deg,#00CCFF,#8000FF);color:#fff;}
.dashboard-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,204,255,0.3);}
.history-list{width:100%;}
.history-item{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all 0.3s;}
.history-item:hover{transform:translateX(4px);border-color:rgba(128,0,255,0.3);}
.history-item-header{display:flex;justify-content:space-between;margin-bottom:6px;}
.history-amount{font-weight:700;color:#00FF55;font-family:'Orbitron',sans-serif;}
.history-status{font-size:0.7rem;padding:2px 10px;border-radius:10px;}
.history-item div{font-size:0.8rem;color:#A0A0B5;}
.history-item div strong{color:#F0F0F0;}
.loading,.no-data{text-align:center;padding:40px;color:#A0A0B5;}
.withdrawal-check-container{background:rgba(255,255,255,0.02);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:20px;margin:20px auto;max-width:600px;text-align:center;width:100%;}
.withdrawal-check-container h3{color:#00EEFF;font-family:'Orbitron',sans-serif;font-size:1.1rem;margin-bottom:12px;}
.withdrawal-check-btn{background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;border:none;padding:10px 24px;border-radius:10px;font-weight:700;cursor:pointer;margin-top:12px;transition:all 0.3s;}
.withdrawal-check-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(168,85,247,0.3);}
.allowed-day{color:#00FF55;font-weight:700;}
.not-allowed-day{color:#FF0055;font-weight:700;}
@media(max-width:500px){.header{padding:12px 16px;flex-wrap:wrap;gap:8px;}.app-title{font-size:1.1rem;}.receipt{padding:20px;}.detail-row{flex-direction:column;gap:4px;}.detail-value,.amount-value{text-align:left;}.action-buttons{flex-direction:column;}}
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
  <div class="logo-container">
    <div class="logo-icon"><i class="fas fa-receipt"></i></div>
    <div class="app-title">FLEXIA</div>
  </div>
  <div style="width:40px;"></div>
</div>

<div class="main-content">
  <button id="history-toggle" onclick="toggleHistory()">View All History</button>
  
  <div id="withdrawal-check" style="display:none;">
    <div class="withdrawal-check-container">
      <h3><i class="fas fa-calendar-check"></i> Withdrawal Status</h3>
      <p id="withdrawal-status-message">Checking withdrawal availability...</p>
      <p id="withdrawal-days-info"></p>
      <button class="withdrawal-check-btn" onclick="checkWithdrawalStatus()"><i class="fas fa-sync-alt"></i> Check Again</button>
    </div>
  </div>
  
  <div id="receipt-container"><div class="loading">Loading receipt...</div></div>
  
  <div class="action-buttons">
    <button class="action-btn download-btn" onclick="downloadReceipt()"><i class="fas fa-download"></i> Save Receipt</button>
    <button class="action-btn dashboard-btn" onclick="goToDashboard()"><i class="fas fa-home"></i> Dashboard</button>
    <button class="action-btn" onclick="checkWithdrawalStatus()" style="background:linear-gradient(135deg,#f87171,#ef4444);color:#fff;"><i class="fas fa-calendar-alt"></i> Check</button>
  </div>
</div>

<script>
let bankMap = {};

async function loadBanks() {
  try {
    const res = await fetch('/api/banking/banks');
    const data = await res.json();
    if (data.success) { data.banks.forEach(b => { bankMap[b.code] = b.name; }); }
    else { loadFallbackBanks(); }
  } catch(err) { loadFallbackBanks(); }
}

function loadFallbackBanks() {
  const fb = [{code:"057",name:"Zenith Bank"},{code:"058",name:"GTBank"},{code:"044",name:"Access Bank"},{code:"033",name:"UBA"},{code:"011",name:"First Bank"},{code:"070",name:"Fidelity Bank"},{code:"050",name:"Ecobank"},{code:"039",name:"Stanbic IBTC"},{code:"214",name:"FCMB"},{code:"232",name:"Sterling Bank"},{code:"032",name:"Union Bank"},{code:"035",name:"Wema Bank"},{code:"082",name:"Keystone Bank"},{code:"215",name:"Unity Bank"},{code:"076",name:"Polaris Bank"},{code:"565",name:"OPay"},{code:"100",name:"PalmPay"},{code:"50211",name:"Kuda Bank"}];
  fb.forEach(b => { bankMap[b.code] = b.name; });
}

function getBankName(code) { return bankMap[code] || `Bank (${code})`; }

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-NG', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function createReceiptHTML(tx) {
  let details = {};
  try { details = typeof tx.details === 'string' ? JSON.parse(tx.details) : (tx.details || {}); } catch(e) {}
  const amount = parseFloat(tx.amount);
  const status = tx.status ? tx.status.toUpperCase() : 'PENDING';
  const statusClass = status.toLowerCase();
  const bankCode = details.bc || details.bank_code || details.bank;
  const bankName = getBankName(bankCode);
  const accountNumber = details.an || details.account_number || 'N/A';
  const accountName = details.nm || details.account_name || 'N/A';
  return `
    <div class="receipt" id="receipt-${tx.id}">
      <div class="receipt-header">
        <div class="receipt-title">WITHDRAWAL RECEIPT</div>
        <div class="receipt-subtitle">ID: ${tx.id}</div>
      </div>
      <div class="receipt-details">
        <div class="detail-row"><span class="detail-label">Amount</span><span class="amount-value">₦${amount.toLocaleString(undefined,{minimumFractionDigits:2})}</span></div>
        <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value status-badge status-${statusClass}">${status}</span></div>
        <div class="detail-row"><span class="detail-label">Date & Time</span><span class="detail-value">${formatDate(tx.timestamp)}</span></div>
        <div class="detail-row"><span class="detail-label">Bank</span><span class="detail-value">${bankName}</span></div>
        <div class="detail-row"><span class="detail-label">Account Number</span><span class="detail-value">${accountNumber}</span></div>
        <div class="detail-row"><span class="detail-label">Account Name</span><span class="detail-value">${accountName}</span></div>
      </div>
      <div class="receipt-footer"><p>Thank you for using FLEXIA</p></div>
    </div>
  `;
}

function createHistoryHTML(transactions) {
  if (!transactions || transactions.length === 0) return '<div class="no-data">No withdrawal history found.</div>';
  let html = '<div class="history-list">';
  transactions.forEach(tx => {
    const amount = parseFloat(tx.amount);
    const status = tx.status ? tx.status.toUpperCase() : 'PENDING';
    const statusClass = status.toLowerCase();
    let details = {};
    try { details = typeof tx.details === 'string' ? JSON.parse(tx.details) : (tx.details || {}); } catch(e) {}
    const bankCode = details.bc || details.bank_code || details.bank;
    const bankName = getBankName(bankCode);
    html += `
      <div class="history-item" onclick="showSingleReceipt('${tx.id}')">
        <div class="history-item-header"><span class="history-amount">₦${amount.toLocaleString()}</span><span class="history-status status-${statusClass}">${status}</span></div>
        <div><strong>Bank:</strong> ${bankName}</div>
        <div><strong>ID:</strong> ${tx.id}</div>
        <div><strong>Date:</strong> ${formatDate(tx.timestamp)}</div>
      </div>
    `;
  });
  html += '</div>';
  return html;
}

function goBack() {
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('history') === 'true') { showSingleReceipt(); }
  else { window.location.href = 'index.html'; }
}

function goToDashboard() { window.location.href = 'index.html'; }

function toggleHistory() {
  const urlParams = new URLSearchParams(window.location.search);
  const isHistory = urlParams.get('history') === 'true';
  if (isHistory) {
    window.history.replaceState({}, '', 'receipt.html');
    document.getElementById('history-toggle').textContent = 'View All History';
    showSingleReceipt();
  } else {
    window.history.replaceState({}, '', 'receipt.html?history=true');
    document.getElementById('history-toggle').textContent = 'View Single Receipt';
    loadHistory();
  }
}

function showSingleReceipt(txId = null) { loadSingleReceipt(txId); }

async function loadSingleReceipt(txId = null) {
  try {
    const res = await fetch('/api/user/profile');
    const data = await res.json();
    if (!data.success) { window.location.href = 'index.html'; return; }
    if (!data.user || !data.user.transactions) { document.getElementById('receipt-container').innerHTML = '<div class="no-data">No transactions found.</div>'; return; }
    const transactions = data.user.transactions.filter(t => t.type === 'WITHDRAWAL');
    let targetTx = txId ? transactions.find(t => t.id === txId) : transactions[transactions.length - 1];
    if (targetTx) { document.getElementById('receipt-container').innerHTML = createReceiptHTML(targetTx); }
    else { document.getElementById('receipt-container').innerHTML = '<div class="no-data">No withdrawal transactions found.</div>'; }
  } catch(err) { console.error('Failed to load receipt:', err); document.getElementById('receipt-container').innerHTML = '<div class="no-data">Failed to load receipt.</div>'; }
}

async function loadHistory() {
  try {
    const res = await fetch('/api/user/profile');
    const data = await res.json();
    if (!data.success) { window.location.href = 'index.html'; return; }
    if (!data.user || !data.user.transactions) { document.getElementById('receipt-container').innerHTML = '<div class="no-data">No transactions found.</div>'; return; }
    const transactions = data.user.transactions.filter(t => t.type === 'WITHDRAWAL').reverse();
    document.getElementById('receipt-container').innerHTML = createHistoryHTML(transactions);
  } catch(err) { console.error('Failed to load history:', err); document.getElementById('receipt-container').innerHTML = '<div class="no-data">Failed to load history.</div>'; }
}

async function downloadReceipt() {
  const receipt = document.querySelector('.receipt');
  if (!receipt) { alert('No receipt to download'); return; }
  try {
    if (typeof html2canvas === 'undefined') {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://html2canvas.hertzen.com/dist/html2canvas.min.js';
        s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    const canvas = await html2canvas(receipt, { scale: 2, useCORS: true, backgroundColor: null, logging: false });
    const link = document.createElement('a');
    link.download = `flexia-receipt-${receipt.id.replace('receipt-', '')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(err) { console.error('Download failed:', err); alert('Failed to download receipt.'); }
}

async function checkWithdrawalStatus() {
  const statusEl = document.getElementById('withdrawal-status-message');
  const daysInfoEl = document.getElementById('withdrawal-days-info');
  const checkContainer = document.getElementById('withdrawal-check');
  if (statusEl) statusEl.textContent = 'Checking...';
  try {
    const profileRes = await fetch('/api/user/profile');
    const profileData = await profileRes.json();
    if (!profileData.success) { if (statusEl) statusEl.innerHTML = '<span class="not-allowed-day">Please login</span>'; return; }
    const today = new Date();
    const todayDay = today.getDate();
    const todayMonth = today.toLocaleString('default', { month: 'long' });
    try {
      const settingsRes = await fetch('/api/admin/global-withdrawal-days', { credentials: 'include' });
      if (settingsRes.ok) {
        const settingsData = await settingsRes.json();
        if (settingsData.success) {
          const withdrawalDays = settingsData.days || [7,14,25,30];
          const isAllowed = withdrawalDays.includes(todayDay);
          if (statusEl) {
            statusEl.innerHTML = isAllowed ? `<span class="allowed-day">✅ Withdrawals ALLOWED today (${todayMonth} ${todayDay})</span>` : `<span class="not-allowed-day">❌ Withdrawals NOT ALLOWED today (${todayMonth} ${todayDay})</span>`;
          }
          if (daysInfoEl) {
            daysInfoEl.innerHTML = `<strong>Allowed Days:</strong> ${withdrawalDays.sort((a,b)=>a-b).join(', ')}<br><small>Today is ${todayMonth} ${todayDay} (Day ${todayDay})</small>`;
          }
          if (checkContainer) checkContainer.style.display = 'block';
          return;
        }
      }
    } catch(adminError) { console.log('Admin endpoint not accessible'); }
    if (checkContainer) checkContainer.style.display = 'block';
    if (statusEl) statusEl.innerHTML = `<span class="${'not-allowed-day'}">Could not determine withdrawal status</span>`;
    if (daysInfoEl) daysInfoEl.innerHTML = `<strong>Today is:</strong> ${todayMonth} ${todayDay} (Day ${todayDay})<br><small>Contact admin for withdrawal days</small>`;
  } catch(error) { console.error('Withdrawal check error:', error); if (statusEl) statusEl.innerHTML = '<span class="not-allowed-day">Error checking status</span>'; }
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadBanks();
  const urlParams = new URLSearchParams(window.location.search);
  const isHistory = urlParams.get('history') === 'true';
  if (isHistory) { document.getElementById('history-toggle').textContent = 'View Single Receipt'; loadHistory(); }
  else { document.getElementById('history-toggle').textContent = 'View All History'; loadSingleReceipt(); }
  setTimeout(() => checkWithdrawalStatus(), 1000);
});
</script>
</body>
</html>
