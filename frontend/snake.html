<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake Mine - FLEXIA</title>
<link rel="icon" type="image/x-icon" href="logo/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="logo/flexia-logo.png">
<link rel="icon" type="image/png" sizes="16x16" href="logo/flexia-logo.png">
<link rel="apple-touch-icon" href="logo/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
}
body {
  font-family: 'Arial', sans-serif;
  background: #000000;
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
}
.header {
  background: #0A0A1F;
  padding: 12px 16px;
  border-bottom: 2px solid #8000FF;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.game-logo {
  display: flex;
  align-items: center;
  gap: 15px;
}
.game-logo-icon {
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(45deg, #8000FF, #00CCFF);
  border-radius: 12px;
  color: white;
  font-weight: bold;
  font-size: 1.5rem;
  box-shadow: 0 5px 15px rgba(128, 0, 255, 0.3);
}
.header-left h1 {
  font-size: 1.4rem;
  color: #8000FF;
  text-shadow: 0 0 10px rgba(128, 0, 255, 0.6);
}
.header-left p {
  color: #00CCFF;
  font-size: 0.8rem;
}
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 12px;
  overflow: hidden;
}
.game-row {
  display: flex;
  flex: 1;
  gap: 12px;
  min-height: 0;
}
.game-panel {
  flex: 2;
  display: flex;
  flex-direction: column;
  background: rgba(30, 30, 69, 0.8);
  border: 2px solid #8000FF;
  border-radius: 12px;
  padding: 12px;
  overflow: hidden;
}
.game-board-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
}
#game-board {
  border: 3px solid #8000FF;
  border-radius: 10px;
  background: #151535;
  box-shadow: 0 8px 25px rgba(128, 0, 255, 0.3);
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  touch-action: none;
}
.scores-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.score-card {
  background: rgba(30, 30, 69, 0.8);
  border: 2px solid #8000FF;
  border-radius: 10px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
}
.score-label {
  font-size: 0.9rem;
  color: #A0A0B5;
  margin-bottom: 8px;
  font-weight: 600;
  text-align: center;
}
.score-value {
  font-size: 1.8rem;
  font-weight: bold;
  color: #00FFCC;
  text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
  text-align: center;
}
.mini-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 12px;
}
.mini-stat {
  text-align: center;
  padding: 8px;
  background: rgba(128, 0, 255, 0.1);
  border-radius: 8px;
  border: 1px solid #8000FF;
}
.mini-label {
  font-size: 0.7rem;
  color: #A0A0B5;
  margin-bottom: 4px;
}
.mini-value {
  font-size: 0.9rem;
  color: #00FFCC;
  font-weight: bold;
}
.controls-row {
  display: flex;
  gap: 12px;
  flex-shrink: 0;
  min-height: 80px;
}
.controls-panel {
  flex: 2;
  display: flex;
  align-items: center;
  justify-content: center;
}
.action-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  max-width: 400px;
}
.action-btn {
  background: linear-gradient(45deg, #8000FF, #00CCFF);
  border: none;
  border-radius: 10px;
  color: #0A0A1F;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
  padding: 14px;
}
.action-btn:active {
  transform: scale(0.95);
}
.action-btn.pulse {
  animation: pulse 2s infinite;
}
.action-btn.glow {
  animation: glow 2s infinite;
}
.dashboard-panel {
  flex: 1;
  display: flex;
  align-items: flex-end;
  justify-content: flex-end;
}
.dashboard-btn {
  background: linear-gradient(45deg, #8000FF, #00CCFF);
  border: none;
  border-radius: 10px;
  color: #0A0A1F;
  padding: 14px 24px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1rem;
  transition: all 0.2s;
  width: 100%;
  max-width: 200px;
  justify-content: center;
}
.dashboard-btn:active {
  transform: scale(0.95);
}

/* Button states */
.action-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
  animation: none !important;
}
.action-btn.processing {
  background: linear-gradient(45deg, #555555, #777777) !important;
  animation: none !important;
}
.action-btn.success {
  background: linear-gradient(45deg, #00FF55, #00CCFF) !important;
  animation: success 0.5s ease-in-out !important;
}
.action-btn.error {
  background: linear-gradient(45deg, #FF5555, #FF8800) !important;
  animation: shake 0.5s ease-in-out !important;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@keyframes glow {
  0%, 100% { box-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
  50% { box-shadow: 0 0 20px rgba(0, 255, 204, 0.8); }
}
@keyframes success {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
  20%, 40%, 60%, 80% { transform: translateX(5px); }
}

/* Game Over Modal */
.game-over-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}
.modal-content {
  background: #0A0A1F;
  border: 3px solid #8000FF;
  border-radius: 15px;
  padding: 30px;
  text-align: center;
  max-width: 400px;
  width: 90%;
}
.modal-content h2 {
  color: #00FFCC;
  margin-bottom: 20px;
}
.modal-stats {
  margin: 20px 0;
}
.modal-stat {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
  padding: 10px;
  background: rgba(128, 0, 255, 0.1);
  border-radius: 8px;
}
.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.modal-btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}
.primary-btn {
  background: linear-gradient(45deg, #8000FF, #00CCFF);
  color: #0A0A1F;
}
.secondary-btn {
  background: #2a2a4a;
  color: #FFFFFF;
  border: 1px solid #8000FF;
}

@media (max-width: 768px) {
  .game-row {
    flex-direction: column;
  }
  .scores-panel {
    flex-direction: row;
    flex-wrap: wrap;
  }
  .score-card {
    min-width: 48%;
  }
  .controls-row {
    min-height: auto;
  }
  .dashboard-panel {
    align-items: center;
    justify-content: center;
  }
  .dashboard-btn {
    max-width: none;
  }
}
@media (max-width: 480px) {
  .header {
    padding: 10px 12px;
  }
  .header-left h1 {
    font-size: 1.2rem;
  }
  .header-left p {
    font-size: 0.7rem;
  }
  .main-content {
    padding: 8px;
  }
  .score-card {
    padding: 12px;
  }
  .score-label {
    font-size: 0.8rem;
  }
  .score-value {
    font-size: 1.4rem;
  }
  .action-btn {
    font-size: 0.9rem;
    padding: 10px;
  }
  .dashboard-btn {
    padding: 12px 20px;
    font-size: 0.9rem;
  }
}
.hidden {
  display: none !important;
}
html, body {
  overscroll-behavior: none;
}
#game-board {
  user-select: none;
  -webkit-user-select: none;
}
canvas {
  display: block;
}
</style>
</head>
<body>
<div class="header">
  <div class="game-logo">
    <div class="game-logo-icon">
      <i class="fas fa-gamepad"></i>
    </div>
    <div class="header-left">
      <h1>SNAKE MINE</h1>
      <p>Eat apples to earn ₦200 per apple! (Max 20 plays/day)</p>
    </div>
  </div>
</div>
<div class="main-content">
  <div class="game-row">
    <div class="game-panel">
      <div class="game-board-container">
        <canvas id="game-board" width="400" height="400"></canvas>
      </div>
    </div>
    <div class="scores-panel">
      <div class="score-card">
        <div class="score-label">CURRENT SCORE</div>
        <div class="score-value" id="score">0</div>
        <div class="mini-stats">
          <div class="mini-stat">
            <div class="mini-label">APPLES EATEN</div>
            <div class="mini-value" id="apples">0</div>
          </div>
          <div class="mini-stat">
            <div class="mini-label">LIVE EARNINGS</div>
            <div class="mini-value" id="live-earnings">₦0</div>
          </div>
        </div>
      </div>
      <div class="score-card">
        <div class="score-label">TOTAL EARNINGS</div>
        <div class="score-value" id="total-earned">₦0</div>
        <div class="mini-stats">
          <div class="mini-stat">
            <div class="mini-label">HIGH SCORE</div>
            <div class="mini-value" id="high-score">0</div>
          </div>
          <div class="mini-stat">
            <div class="mini-label">GAMES PLAYED</div>
            <div class="mini-value" id="games-played">0</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="controls-row">
  <div class="controls-panel">
    <div class="action-buttons">
      <button class="action-btn pulse" onclick="startGame()" id="start-btn">
        <i class="fas fa-play"></i> START GAME
      </button>
      <button class="action-btn glow" onclick="submitScore()" id="claim-btn">
        <i class="fas fa-trophy"></i> CLAIM REWARD
      </button>
    </div>
  </div>
  <div class="dashboard-panel">
    <button class="dashboard-btn" onclick="window.location.href='index.html'">
      <i class="fas fa-arrow-left"></i> BACK TO DASHBOARD
    </button>
  </div>
</div>

<!-- Game Over Modal -->
<div id="game-over-modal" class="game-over-modal hidden">
  <div class="modal-content">
    <h2><i class="fas fa-gamepad"></i> GAME OVER</h2>
    <div class="modal-stats">
      <div class="modal-stat">
        <span>Score:</span>
        <span id="modal-score">0</span>
      </div>
      <div class="modal-stat">
        <span>Apples Eaten:</span>
        <span id="modal-apples">0</span>
      </div>
      <div class="modal-stat">
        <span>Reward:</span>
        <span id="modal-reward">₦0</span>
      </div>
    </div>
    <div class="modal-buttons">
      <button class="modal-btn primary-btn" onclick="playAgain()">
        <i class="fas fa-redo"></i> PLAY AGAIN
      </button>
      <button class="modal-btn secondary-btn" onclick="closeModal()">
        <i class="fas fa-times"></i> CLOSE
      </button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game-board');
const ctx = canvas.getContext('2d');
const gridSize = 20;
const tileCount = canvas.width / gridSize;
let snake = [];
let food = {};
let score = 0;
let direction = 'right';
let gameRunning = false;
let gameLoop;
let highScore = localStorage.getItem('snake_high_score') || 0;
let gamesPlayed = localStorage.getItem('snake_games_played') || 0;
let totalEarned = 0;
let currentGameEarnings = 0;
const EARNINGS_PER_APPLE = 200;
let isClaiming = false;

// Load user data
async function loadUserData() {
  try {
    // Try to load real data from API
    const response = await fetch('/api/user/profile', {
      credentials: 'include'
    });
    
    if (response.ok) {
      const data = await response.json();
      if (data.success) {
        const user = data.user;
        const stats = user.game_stats || {};
        const snakeStats = stats.snake || {};
        
        highScore = snakeStats.high_score || 0;
        gamesPlayed = snakeStats.total_score ? Math.floor(snakeStats.total_score / 10) : 0;
        totalEarned = 0; // This should come from transactions
        
        // Get earnings from transactions
        const transactions = user.transactions || [];
        for (const tx of transactions) {
          if (tx.type === 'SNAKE_REWARD') {
            totalEarned += parseFloat(tx.amount) || 0;
          }
        }
      }
    }
  } catch (error) {
    console.log('Using default values:', error);
  }
  
  document.getElementById('high-score').textContent = highScore;
  document.getElementById('games-played').textContent = gamesPlayed;
  document.getElementById('total-earned').textContent = `₦${totalEarned.toLocaleString()}`;
}

function initGame() {
  snake = [{x: 10, y: 10}];
  generateFood();
  score = 0;
  currentGameEarnings = 0;
  updateDisplay();
  drawGame();
}

function generateFood() {
  food = {
    x: Math.floor(Math.random() * tileCount),
    y: Math.floor(Math.random() * tileCount)
  };
  for (let segment of snake) {
    if (segment.x === food.x && segment.y === food.y) {
      generateFood();
      return;
    }
  }
  food.golden = Math.random() < 0.1;
}

function drawGame() {
  ctx.fillStyle = '#151535';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Draw grid
  ctx.strokeStyle = 'rgba(128, 0, 255, 0.1)';
  ctx.lineWidth = 1;
  for (let x = 0; x < tileCount; x++) {
    for (let y = 0; y < tileCount; y++) {
      ctx.strokeRect(x * gridSize, y * gridSize, gridSize, gridSize);
    }
  }
  
  // Draw snake
  for (let i = 0; i < snake.length; i++) {
    const segment = snake[i];
    if (i === 0) {
      ctx.fillStyle = '#00FFCC';
      ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
      ctx.fillStyle = '#0A0A1F';
      ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 5, 4, 4);
      ctx.fillRect(segment.x * gridSize + 11, segment.y * gridSize + 5, 4, 4);
    } else {
      const intensity = 1 - (i / snake.length) * 0.5;
      ctx.fillStyle = `rgba(0, 255, 204, ${intensity})`;
      ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
    }
  }
  
  // Draw food
  const pulse = Math.sin(Date.now() / 200) * 2;
  if (food.golden) {
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(
      food.x * gridSize + gridSize / 2,
      food.y * gridSize + gridSize / 2,
      (gridSize - 4) / 2 + pulse,
      0,
      2 * Math.PI
    );
    ctx.fill();
  } else {
    ctx.fillStyle = '#FF0055';
    ctx.beginPath();
    ctx.arc(
      food.x * gridSize + gridSize / 2,
      food.y * gridSize + gridSize / 2,
      (gridSize - 4) / 2 + pulse,
      0,
      2 * Math.PI
    );
    ctx.fill();
  }
  
  // Draw stem
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(food.x * gridSize + 8, food.y * gridSize - 2, 2, 4);
  
  // Draw leaf
  ctx.fillStyle = '#00FF55';
  ctx.beginPath();
  ctx.ellipse(
    food.x * gridSize + 10,
    food.y * gridSize - 1,
    3,
    2,
    Math.PI / 4,
    0,
    2 * Math.PI
  );
  ctx.fill();
}

function updateGame() {
  if (!gameRunning) return;
  
  const head = {x: snake[0].x, y: snake[0].y};
  switch(direction) {
    case 'up': head.y--; break;
    case 'down': head.y++; break;
    case 'left': head.x--; break;
    case 'right': head.x++; break;
  }
  
  // Wall collision
  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    gameOver();
    return;
  }
  
  // Self collision
  for (let i = 1; i < snake.length; i++) {
    if (head.x === snake[i].x && head.y === snake[i].y) {
      gameOver();
      return;
    }
  }
  
  snake.unshift(head);
  
  // Food collision
  if (head.x === food.x && head.y === food.y) {
    const appleValue = food.golden ? EARNINGS_PER_APPLE * 2 : EARNINGS_PER_APPLE;
    score += 10;
    currentGameEarnings += appleValue;
    generateFood();
    updateDisplay();
    
    // Visual feedback
    const scoreEl = document.getElementById('score');
    scoreEl.style.transform = 'scale(1.1)';
    setTimeout(() => scoreEl.style.transform = 'scale(1)', 200);
  } else {
    snake.pop();
  }
  
  drawGame();
}

function gameOver() {
  gameRunning = false;
  clearInterval(gameLoop);
  gamesPlayed++;
  document.getElementById('games-played').textContent = gamesPlayed;
  
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snake_high_score', highScore);
    document.getElementById('high-score').textContent = highScore;
  }
  
  // Update modal
  const apples = Math.floor(score / 10);
  document.getElementById('modal-score').textContent = score;
  document.getElementById('modal-apples').textContent = apples;
  document.getElementById('modal-reward').textContent = `₦${currentGameEarnings}`;
  
  // Show modal
  document.getElementById('game-over-modal').classList.remove('hidden');
}

function startGame() {
  if (gameRunning) return;
  
  const startBtn = document.getElementById('start-btn');
  const originalText = startBtn.innerHTML;
  startBtn.disabled = true;
  startBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> STARTING...';
  
  setTimeout(() => {
    initGame();
    gameRunning = true;
    gameLoop = setInterval(updateGame, 120);
    
    startBtn.disabled = false;
    startBtn.innerHTML = originalText;
  }, 500);
}

function playAgain() {
  document.getElementById('game-over-modal').classList.add('hidden');
  startGame();
}

function closeModal() {
  document.getElementById('game-over-modal').classList.add('hidden');
}

function changeDirection(newDirection) {
  if (
    (newDirection === 'up' && direction !== 'down') ||
    (newDirection === 'down' && direction !== 'up') ||
    (newDirection === 'left' && direction !== 'right') ||
    (newDirection === 'right' && direction !== 'left')
  ) {
    direction = newDirection;
  }
}

function updateDisplay() {
  document.getElementById('score').textContent = score;
  const apples = Math.floor(score / 10);
  document.getElementById('apples').textContent = apples;
  document.getElementById('live-earnings').textContent = `₦${currentGameEarnings}`;
}

async function submitScore() {
  if (isClaiming) {
    alert('Please wait, another claim is in progress');
    return;
  }
  
  const apples = Math.floor(score / 10);
  if (apples <= 0) {
    alert('No apples to claim! Play the game first.');
    return;
  }
  
  if (gameRunning) {
    alert('Please finish the game first!');
    return;
  }
  
  isClaiming = true;
  const claimBtn = document.getElementById('claim-btn');
  const originalText = claimBtn.innerHTML;
  
  try {
    claimBtn.disabled = true;
    claimBtn.classList.remove('glow');
    claimBtn.classList.add('processing');
    claimBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> PROCESSING...';
    
    // Call the backend API
    const response = await fetch('/api/games/snake/report', {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
      },
      credentials: 'include',
      body: JSON.stringify({ apples_eaten: apples })
    });
    
    const result = await response.json();
    
    if (result.success) {
      // Update UI with API response
      totalEarned += result.reward;
      
      // Update UI
      document.getElementById('total-earned').textContent = `₦${totalEarned.toLocaleString()}`;
      
      claimBtn.classList.remove('processing');
      claimBtn.classList.add('success');
      claimBtn.innerHTML = `<i class="fas fa-check"></i> CLAIMED! ₦${result.reward}`;
      
      alert(`✅ Success! Claimed ₦${result.reward} for ${apples} apples`);
      
      // Reset game
      score = 0;
      currentGameEarnings = 0;
      updateDisplay();
      closeModal();
      
      setTimeout(() => {
        claimBtn.classList.remove('success');
        claimBtn.disabled = false;
        claimBtn.classList.add('glow');
        claimBtn.innerHTML = originalText;
        isClaiming = false;
      }, 3000);
      
    } else {
      throw new Error(result.message);
    }
    
  } catch (error) {
    console.error('Claim error:', error);
    
    claimBtn.classList.remove('processing');
    claimBtn.classList.add('error');
    claimBtn.innerHTML = '<i class="fas fa-times"></i> FAILED';
    
    alert('❌ ' + error.message);
    
    setTimeout(() => {
      claimBtn.classList.remove('error');
      claimBtn.disabled = false;
      claimBtn.classList.add('glow');
      claimBtn.innerHTML = originalText;
      isClaiming = false;
    }, 2000);
  }
}

// Event listeners
document.addEventListener('keydown', (e) => {
  switch(e.key) {
    case 'ArrowUp': changeDirection('up'); e.preventDefault(); break;
    case 'ArrowDown': changeDirection('down'); e.preventDefault(); break;
    case 'ArrowLeft': changeDirection('left'); e.preventDefault(); break;
    case 'ArrowRight': changeDirection('right'); e.preventDefault(); break;
    case ' ': startGame(); e.preventDefault(); break;
    case 'Escape': window.location.href = 'index.html'; e.preventDefault(); break;
  }
});

// Touch controls
let touchStartX = 0;
let touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  const touchEndX = e.changedTouches[0].clientX;
  const touchEndY = e.changedTouches[0].clientY;
  const diffX = touchStartX - touchEndX;
  const diffY = touchStartY - touchEndY;
  
  if (Math.abs(diffX) > 20 || Math.abs(diffY) > 20) {
    if (Math.abs(diffX) > Math.abs(diffY)) {
      if (diffX > 0) changeDirection('left');
      else changeDirection('right');
    } else {
      if (diffY > 0) changeDirection('up');
      else changeDirection('down');
    }
  }
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (gameRunning) {
    e.preventDefault();
  }
}, { passive: false });

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  loadUserData();
  initGame();
  
  // Canvas responsive sizing
  function resizeCanvas() {
    const container = document.querySelector('.game-board-container');
    const maxSize = Math.min(container.clientWidth, container.clientHeight);
    canvas.style.width = `${maxSize}px`;
    canvas.style.height = `${maxSize}px`;
    drawGame();
  }
  
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
});
</script>

<!-- Global Functions -->
<script>
// Ensure API functions are available
if (typeof window.claimSnakeReward === 'undefined') {
  window.claimSnakeReward = async function(apples) {
    try {
      const response = await fetch('/api/games/snake/report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ apples_eaten: apples })
      });
      return await response.json();
    } catch (error) {
      return { success: false, message: error.message };
    }
  };
}
</script>
