<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake Mine - FLEXIA</title>
<!-- CORRECTED: Updated logo paths -->
<link rel="icon" type="image/x-icon" href="logo/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="logo/flexia-logo.png">
<link rel="icon" type="image/png" sizes="16x16" href="logo/flexia-logo.png">
<link rel="apple-touch-icon" href="logo/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<!-- Fonts & CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
}
body {
  font-family: 'Arial', sans-serif;
  background: #000000;
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
}
.header {
  background: #0A0A1F;
  padding: 12px 16px;
  border-bottom: 2px solid #8000FF;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.game-logo {
  display: flex;
  align-items: center;
  gap: 15px;
}
.game-logo-icon {
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(45deg, #8000FF, #00CCFF);
  border-radius: 12px;
  color: white;
  font-weight: bold;
  font-size: 1.5rem;
  box-shadow: 0 5px 15px rgba(128, 0, 255, 0.3);
}
.header-left h1 {
  font-size: 1.4rem;
  color: #8000FF;
  text-shadow: 0 0 10px rgba(128, 0, 255, 0.6);
}
.header-left p {
  color: #00CCFF;
  font-size: 0.8rem;
}
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 12px;
  overflow: hidden;
}
.game-row {
  display: flex;
  flex: 1;
  gap: 12px;
  min-height: 0;
}
.game-panel {
  flex: 2;
  display: flex;
  flex-direction: column;
  background: rgba(30, 30, 69, 0.8);
  border: 2px solid #8000FF;
  border-radius: 12px;
  padding: 12px;
  overflow: hidden;
}
.game-board-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
}
#game-board {
  border: 3px solid #8000FF;
  border-radius: 10px;
  background: #151535;
  box-shadow: 0 8px 25px rgba(128, 0, 255, 0.3);
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  touch-action: none;
}
.scores-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.score-card {
  background: rgba(30, 30, 69, 0.8);
  border: 2px solid #8000FF;
  border-radius: 10px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
}
.score-label {
  font-size: 0.9rem;
  color: #A0A0B5;
  margin-bottom: 8px;
  font-weight: 600;
  text-align: center;
}
.score-value {
  font-size: 1.8rem;
  font-weight: bold;
  color: #00FFCC;
  text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
  text-align: center;
}
.mini-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 12px;
}
.mini-stat {
  text-align: center;
  padding: 8px;
  background: rgba(128, 0, 255, 0.1);
  border-radius: 8px;
  border: 1px solid #8000FF;
}
.mini-label {
  font-size: 0.7rem;
  color: #A0A0B5;
  margin-bottom: 4px;
}
.mini-value {
  font-size: 0.9rem;
  color: #00FFCC;
  font-weight: bold;
}
.controls-row {
  display: flex;
  gap: 12px;
  flex-shrink: 0;
  min-height: 80px;
}
.controls-panel {
  flex: 2;
  display: flex;
  align-items: center;
  justify-content: center;
}
.action-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  max-width: 400px;
}
.action-btn {
  background: linear-gradient(45deg, #8000FF, #00CCFF);
  border: none;
  border-radius: 10px;
  color: #0A0A1F;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
  padding: 14px;
}
.action-btn:active {
  transform: scale(0.95);
}
.action-btn.pulse {
  animation: pulse 2s infinite;
}
.action-btn.glow {
  animation: glow 2s infinite;
}
.dashboard-panel {
  flex: 1;
  display: flex;
  align-items: flex-end;
  justify-content: flex-end;
}
.dashboard-btn {
  background: linear-gradient(45deg, #8000FF, #00CCFF);
  border: none;
  border-radius: 10px;
  color: #0A0A1F;
  padding: 14px 24px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1rem;
  transition: all 0.2s;
  width: 100%;
  max-width: 200px;
  justify-content: center;
}
.dashboard-btn:active {
  transform: scale(0.95);
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@keyframes glow {
  0%, 100% { box-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
  50% { box-shadow: 0 0 20px rgba(0, 255, 204, 0.8); }
}
@media (max-width: 768px) {
  .game-row {
    flex-direction: column;
  }
  .scores-panel {
    flex-direction: row;
    flex-wrap: wrap;
  }
  .score-card {
    min-width: 48%;
  }
  .controls-row {
    min-height: auto;
  }
  .dashboard-panel {
    align-items: center;
    justify-content: center;
  }
  .dashboard-btn {
    max-width: none;
  }
}
@media (max-width: 480px) {
  .header {
    padding: 10px 12px;
  }
  .header-left h1 {
    font-size: 1.2rem;
  }
  .header-left p {
    font-size: 0.7rem;
  }
  .main-content {
    padding: 8px;
  }
  .score-card {
    padding: 12px;
  }
  .score-label {
    font-size: 0.8rem;
  }
  .score-value {
    font-size: 1.4rem;
  }
  .action-btn {
    font-size: 0.9rem;
    padding: 10px;
  }
  .dashboard-btn {
    padding: 12px 20px;
    font-size: 0.9rem;
  }
}
.hidden {
  display: none !important;
}
html, body {
  overscroll-behavior: none;
}
#game-board {
  user-select: none;
  -webkit-user-select: none;
}
canvas {
  display: block;
}
</style>
</head>
<body>
<div class="header">
  <div class="game-logo">
    <div class="game-logo-icon">
      <i class="fas fa-gamepad"></i>
    </div>
    <div class="header-left">
      <h1>SNAKE MINE</h1>
      <p>Eat apples to earn ₦200 per apple! (Max 20 plays/day)</p>
    </div>
  </div>
</div>
<div class="main-content">
  <div class="game-row">
    <div class="game-panel">
      <div class="game-board-container">
        <canvas id="game-board" width="400" height="400"></canvas>
      </div>
    </div>
    <div class="scores-panel">
      <div class="score-card">
        <div class="score-label">CURRENT SCORE</div>
        <div class="score-value" id="score">0</div>
        <div class="mini-stats">
          <div class="mini-stat">
            <div class="mini-label">APPLES EATEN</div>
            <div class="mini-value" id="apples">0</div>
          </div>
          <div class="mini-stat">
            <div class="mini-label">LIVE EARNINGS</div>
            <div class="mini-value" id="live-earnings">₦0</div>
          </div>
        </div>
      </div>
      <div class="score-card">
        <div class="score-label">TOTAL EARNINGS</div>
        <div class="score-value" id="total-earned">₦0</div>
        <div class="mini-stats">
          <div class="mini-stat">
            <div class="mini-label">HIGH SCORE</div>
            <div class="mini-value" id="high-score">0</div>
          </div>
          <div class="mini-stat">
            <div class="mini-label">GAMES PLAYED</div>
            <div class="mini-value" id="games-played">0</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="controls-row">
  <div class="controls-panel">
    <div class="action-buttons">
      <button class="action-btn pulse" onclick="startGame()">
        <i class="fas fa-play"></i> START GAME
      </button>
      <button class="action-btn glow" onclick="submitScore()">
        <i class="fas fa-trophy"></i> CLAIM REWARD
      </button>
    </div>
  </div>
  <div class="dashboard-panel">
    <button class="dashboard-btn" onclick="window.location.href='index.html'">
      <i class="fas fa-arrow-left"></i> BACK TO DASHBOARD
    </button>
  </div>
</div>
<script>
const canvas = document.getElementById('game-board');
const ctx = canvas.getContext('2d');
const gridSize = 20;
const tileCount = canvas.width / gridSize;
let snake = [];
let food = {};
let score = 0;
let direction = 'right';
let gameRunning = false;
let gameLoop;
let highScore = 0;
let gamesPlayed = 0;
let totalEarned = 0;
let currentGameEarnings = 0;
const EARNINGS_PER_APPLE = 200;

async function loadUserProfile() {
  try {
    const res = await fetch('/api/user/profile');
    const data = await res.json();
    if (data.success) {
      const stats = data.user.game_stats?.snake || {};
      highScore = stats.high_score || 0;
      document.getElementById('high-score').textContent = highScore;
    } else {
      window.location.href = 'index.html';
    }
  } catch (e) {
    console.error('Profile load failed:', e);
    window.location.href = 'index.html';
  }
}

function initGame() {
  snake = [{x: 10, y: 10}];
  generateFood();
  score = 0;
  currentGameEarnings = 0;
  updateDisplay();
  drawGame();
}

function generateFood() {
  food = {
    x: Math.floor(Math.random() * tileCount),
    y: Math.floor(Math.random() * tileCount)
  };
  for (let segment of snake) {
    if (segment.x === food.x && segment.y === food.y) {
      generateFood();
      return;
    }
  }
  food.golden = Math.random() < 0.1;
}

function drawGame() {
  ctx.fillStyle = '#151535';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(128, 0, 255, 0.1)';
  ctx.lineWidth = 1;
  for (let x = 0; x < tileCount; x++) {
    for (let y = 0; y < tileCount; y++) {
      ctx.strokeRect(x * gridSize, y * gridSize, gridSize, gridSize);
    }
  }
  for (let i = 0; i < snake.length; i++) {
    const segment = snake[i];
    if (i === 0) {
      ctx.fillStyle = '#00FFCC';
      ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
      ctx.fillStyle = '#0A0A1F';
      ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 5, 4, 4);
      ctx.fillRect(segment.x * gridSize + 11, segment.y * gridSize + 5, 4, 4);
    } else {
      const intensity = 1 - (i / snake.length) * 0.5;
      ctx.fillStyle = `rgba(0, 255, 204, ${intensity})`;
      ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
    }
  }
  const pulse = Math.sin(Date.now() / 200) * 2;
  if (food.golden) {
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(
      food.x * gridSize + gridSize / 2,
      food.y * gridSize + gridSize / 2,
      (gridSize - 4) / 2 + pulse,
      0,
      2 * Math.PI
    );
    ctx.fill();
    ctx.fillStyle = '#FFFFE0';
    ctx.beginPath();
    ctx.ellipse(
      food.x * gridSize + gridSize / 2 - 3,
      food.y * gridSize + gridSize / 2 - 3,
      3 + pulse/2,
      2 + pulse/2,
      Math.PI / 4,
      0,
      2 * Math.PI
    );
    ctx.fill();
  } else {
    ctx.fillStyle = '#FF0055';
    ctx.beginPath();
    ctx.arc(
      food.x * gridSize + gridSize / 2,
      food.y * gridSize + gridSize / 2,
      (gridSize - 4) / 2 + pulse,
      0,
      2 * Math.PI
    );
    ctx.fill();
  }
  // Draw stem
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(food.x * gridSize + 8, food.y * gridSize - 2, 2, 4);
  // Draw leaf
  ctx.fillStyle = '#00FF55';
  ctx.beginPath();
  ctx.ellipse(food.x * gridSize + 10, food.y * gridSize - 1, 3, 2, Math.PI / 4, 0, 2 * Math.PI);
  ctx.fill();
}

function updateGame() {
  if (!gameRunning) return;
  const head = {x: snake[0].x, y: snake[0].y};
  switch(direction) {
    case 'up': head.y--; break;
    case 'down': head.y++; break;
    case 'left': head.x--; break;
    case 'right': head.x++; break;
  }
  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    gameOver();
    return;
  }
  for (let i = 1; i < snake.length; i++) {
    if (head.x === snake[i].x && head.y === snake[i].y) {
      gameOver();
      return;
    }
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    const appleValue = food.golden ? EARNINGS_PER_APPLE * 2 : EARNINGS_PER_APPLE;
    score += 10;
    currentGameEarnings += appleValue;
    generateFood();
    updateDisplay();
    const scoreEl = document.getElementById('score');
    scoreEl.style.transform = 'scale(1.1)';
    setTimeout(() => scoreEl.style.transform = 'scale(1)', 200);
  } else {
    snake.pop();
  }
  drawGame();
}

function gameOver() {
  gameRunning = false;
  clearInterval(gameLoop);
  gamesPlayed++;
  document.getElementById('games-played').textContent = gamesPlayed;
  if (score > highScore) {
    highScore = score;
    document.getElementById('high-score').textContent = highScore;
  }
  setTimeout(() => {
    alert(`Game Over! 🎮\nScore: ${score}\nApples Eaten: ${Math.floor(score / 10)}\nEarnings: ₦${currentGameEarnings}`);
  }, 500);
}

function startGame() {
  if (gameRunning) return;
  initGame();
  gameRunning = true;
  gameLoop = setInterval(updateGame, 120);
}

function changeDirection(newDirection) {
  if (
    (newDirection === 'up' && direction !== 'down') ||
    (newDirection === 'down' && direction !== 'up') ||
    (newDirection === 'left' && direction !== 'right') ||
    (newDirection === 'right' && direction !== 'left')
  ) {
    direction = newDirection;
  }
}

function updateDisplay() {
  document.getElementById('score').textContent = score;
  const apples = Math.floor(score / 10);
  document.getElementById('apples').textContent = apples;
  document.getElementById('live-earnings').textContent = `₦${currentGameEarnings}`;
}

async function submitScore() {
  const apples = Math.floor(score / 10);
  if (apples <= 0) {
    alert('Play the game first!');
    return;
  }
  const res = await fetch('/api/games/snake/report', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ apples_eaten: apples }),
    credentials: 'include'
  });
  const data = await res.json();
  if (data.success) {
    totalEarned += data.reward;
    document.getElementById('total-earned').textContent = `₦${totalEarned.toLocaleString()}`;
    alert(`✅ Reward claimed!\nEarnings: ₦${data.reward}`);
    initGame();
    if (!gameRunning) startGame();
  } else {
    alert('❌ ' + (data.message || 'You can only play Snake 20 times per day.'));
  }
}

document.addEventListener('keydown', (e) => {
  switch(e.key) {
    case 'ArrowUp': changeDirection('up'); e.preventDefault(); break;
    case 'ArrowDown': changeDirection('down'); e.preventDefault(); break;
    case 'ArrowLeft': changeDirection('left'); e.preventDefault(); break;
    case 'ArrowRight': changeDirection('right'); e.preventDefault(); break;
    case ' ': startGame(); e.preventDefault(); break;
    case 'Escape': window.location.href = 'index.html'; e.preventDefault(); break;
  }
});

let touchStartX = 0;
let touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  e.preventDefault();
}, { passive: false });

document.addEventListener('touchend', (e) => {
  const touchEndX = e.changedTouches[0].clientX;
  const touchEndY = e.changedTouches[0].clientY;
  const diffX = touchStartX - touchEndX;
  const diffY = touchStartY - touchEndY;
  if (Math.abs(diffX) > 20 || Math.abs(diffY) > 20) {
    if (Math.abs(diffX) > Math.abs(diffY)) {
      if (diffX > 0) changeDirection('left');
      else changeDirection('right');
    } else {
      if (diffY > 0) changeDirection('up');
      else changeDirection('down');
    }
  }
}, { passive: true });

document.addEventListener('DOMContentLoaded', () => {
  loadUserProfile();
  initGame();
  window.addEventListener('resize', () => {
    const container = document.querySelector('.game-board-container');
    const maxSize = Math.min(container.clientWidth, container.clientHeight);
    canvas.style.width = `${maxSize}px`;
    canvas.style.height = `${maxSize}px`;
    drawGame();
  });
});
</script>
</body>
</html>
